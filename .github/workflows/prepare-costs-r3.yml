name: Validate approved cost catalog patch
on:
  push:
    branches: ['fix/approved-costs-r3-20261006']
    paths: ['tools/apply_cost_catalog_r3.py', '.github/workflows/prepare-costs-r3.yml']
permissions:
  contents: write
concurrency:
  group: prepare-costs-r3
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate and apply code-only patch
        run: |
          python3 tools/apply_cost_catalog_r3.py
          git add index.html sw.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Usar catálogo de custos da base online após testes'
          git push origin HEAD:fix/approved-costs-r3-20261006
