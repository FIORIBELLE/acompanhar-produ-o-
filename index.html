<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhar Produção</title>
<meta name="theme-color" content="#18212e">
<meta name="application-name" content="Acompanhar Produção">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Produção">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" id="app-icon" type="image/svg+xml">
<link rel="apple-touch-icon" id="apple-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#EDF0F3;--card:#FFFFFF;--ink:#18212E;--soft:#5B6878;--line:#D5DBE2;
  --bar:#2C5A86;--bar2:#9AAFC4;--track:#E3E8EE;--live:#C98A00;--danger:#A53B3B;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121821;--card:#1B2330;--ink:#E8EDF3;--soft:#9AA7B6;--line:#2C3644;--bar:#6FA3D6;--bar2:#4A5D73;--track:#263040;--live:#E6B33A;--danger:#F08A8A}
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select{font:inherit}
button{touch-action:manipulation}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:4px 0 14px}
h1{font-size:1.6rem;font-weight:800;font-stretch:80%;margin:0;letter-spacing:-.01em}
.status{font-size:.82rem;color:var(--soft);text-align:right;max-width:48%}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:6px;vertical-align:middle}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:8}
nav button{flex:1;min-width:0;border:0;background:transparent;color:var(--soft);font-weight:600;padding:11px 3px;border-radius:7px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,.week-card:focus-visible{outline:3px solid var(--live);outline-offset:2px}
.block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.block h2{font-size:1.1rem;margin:0 0 4px;font-weight:700}
.sub{color:var(--soft);font-size:.85rem;margin:0 0 10px}
.meter{margin:2px 0 18px}
.meter-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.meter-num{font-size:3rem;font-weight:800;font-stretch:75%;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.meter-num small{font-size:1rem;font-weight:600;letter-spacing:0}
.meter-cap{color:var(--soft);font-size:.9rem;text-align:right}
.meter-track,.bar{background:var(--track);border-radius:3px;overflow:hidden}
.meter-track{height:14px;margin-top:8px}
.meter-fill,.bar span{display:block;height:100%;background:var(--bar);transition:width .35s ease}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.summary-stat{padding:10px;background:var(--track);border-radius:7px;min-width:0}
.summary-stat strong{display:block;font-size:1.08rem;font-variant-numeric:tabular-nums}
.summary-stat span{color:var(--soft);font-size:.78rem}
.row{padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.name{font-weight:650;min-width:0}
.value{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.votes{color:var(--soft);font-size:.8rem;font-variant-numeric:tabular-nums;margin-top:2px}
.bar{height:7px;margin-top:6px}.bar.secondary span{background:var(--bar2)}
.tag{display:inline-block;font-size:.72rem;font-weight:750;padding:2px 6px;border-radius:4px;background:var(--live);color:#1A1200;margin-left:6px;vertical-align:1px}
.notice{padding:11px 12px;border-left:4px solid var(--live);background:var(--track);border-radius:0 7px 7px 0;font-size:.88rem;margin-bottom:14px}
.readonly{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field{margin-bottom:13px}.field label,.legend{display:block;color:var(--soft);font-size:.84rem;margin-bottom:5px}
input,select{width:100%;min-height:46px;padding:10px 11px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type="date"]{min-height:46px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-3px 0 13px}
.btn,.quick button,.icon-btn{min-height:46px;padding:10px 13px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font-weight:650;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger,.icon-btn.danger{color:var(--danger)}
.btn.full{width:100%}.btn.small{min-height:38px;padding:7px 10px;font-size:.85rem}
.button-row{display:flex;gap:8px;flex-wrap:wrap}.button-row .btn{flex:1}
.entry-actions{display:flex;gap:6px;flex-shrink:0}.entry-actions .icon-btn{min-height:38px;padding:6px 9px;font-size:.8rem}
.entry-main{min-width:0}.entry-title{font-weight:700}.entry-meta{color:var(--soft);font-size:.8rem}
.week-card{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:8px;cursor:pointer}
.week-card-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.week-card strong{font-size:1rem}.week-card .pct{font-size:1.05rem;font-weight:800}
.empty{color:var(--soft);font-size:.9rem;padding:18px 0;text-align:center}
.settings-list{margin:10px 0}.setting-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.setting-item:first-child{border-top:0}.setting-item input{min-height:42px}
.mounting-item{grid-template-columns:minmax(0,1fr) 112px auto}.mounting-item .rate-field{position:relative}.mounting-item .rate-field::before{content:"R$";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--soft);font-size:.78rem}.mounting-item .rate-field input{padding-left:32px}
.mini-actions{display:flex;gap:5px}.mini-actions button{min-width:40px;min-height:40px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);cursor:pointer}
.mini-actions .remove{color:var(--danger)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}
.day-check{position:relative}.day-check input{position:absolute;opacity:0;pointer-events:none}.day-check span{display:grid;place-items:center;min-height:44px;border:1px solid var(--line);border-radius:7px;color:var(--soft);font-weight:650;cursor:pointer}
.day-check input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.backup-status{font-size:.83rem;color:var(--soft);margin-top:8px}.backup-status.warn{color:var(--live);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;width:min(calc(100% - 32px),520px);padding:11px 14px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:.9rem;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.22)}
.toast[hidden],.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:grid;place-items:end center;padding:16px}
.sheet{width:min(100%,520px);max-height:88vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:16px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.sheet h2{margin:0 0 7px;font-size:1.25rem}.sheet p{margin:0 0 12px}.sheet ul{padding-left:20px;color:var(--soft)}
.calc{font-size:.86rem;color:var(--soft);padding:9px 10px;background:var(--track);border-radius:7px;margin:8px 0}
.gargalo{border-color:var(--live)}
.model-goal-grid{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:8px;align-items:center;padding:6px 0}.model-goal-grid label{font-size:.9rem}
.actions{display:flex;gap:8px;margin:0 0 12px}.actions .btn{flex:1}
footer{color:var(--soft);font-size:.78rem;text-align:center;padding:8px 0 24px}
@media(max-width:400px){.wrap{padding:12px}.meter-num{font-size:2.65rem}nav button{font-size:.82rem}.form-grid{grid-template-columns:1fr}.summary-grid{gap:8px}.summary-stat{padding:9px}.days{grid-template-columns:repeat(4,1fr)}.mounting-item{grid-template-columns:minmax(0,1fr) 100px}.mounting-item .mini-actions{grid-column:1/-1;justify-content:flex-end}}
@media(prefers-reduced-motion:reduce){.meter-fill,.bar span{transition:none}}
@media(display-mode:standalone){.install-help{display:none}}

/* STOCK_PANEL_V1 */
.stock-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stock-sector-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px}
.stock-sector-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:.9rem}
.stock-sector-head span{color:var(--soft);font-size:.78rem;white-space:nowrap}
.stock-big{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;margin:8px 0 3px}
.stock-total{border-color:var(--ink)}
.stock-total-value{font-size:2.25rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stock-muted{color:var(--soft);font-size:.78rem}
.stock-pending{font-size:.72rem;color:var(--live);font-weight:750}
.stock-warning{margin-top:8px;padding:8px 9px;border-radius:7px;background:var(--track);color:var(--live);font-size:.8rem;font-weight:650}
.stock-warning-inline{color:var(--live);font-weight:700}
.stock-detail .calc strong{color:var(--ink)}
@media(max-width:520px){.stock-grid{grid-template-columns:1fr}.stock-sector-card{padding:12px}}
\n</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Acompanhar Produção</h1>
    <div class="status"><span class="dot"></span><span id="header-status">Salvo neste iPhone</span></div>
  </header>

  <nav role="tablist" aria-label="Navegação principal">
    <button role="tab" aria-selected="true" data-tab="week">Semana</button>
    <button role="tab" aria-selected="false" data-tab="stock">Estoque</button>
    <button role="tab" aria-selected="false" data-tab="entry">Lançar</button>
    <button role="tab" aria-selected="false" data-tab="history">Histórico</button>
    <button role="tab" aria-selected="false" data-tab="settings">Ajustes</button>
  </nav>

  <main>
    <section id="tab-week"></section>
    <section id="tab-stock" hidden></section>
    <section id="tab-entry" hidden></section>
    <section id="tab-history" hidden></section>
    <section id="tab-settings" hidden></section>
  </main>

  <div class="actions">
    <button class="btn" id="edit-goal" type="button">Editar meta</button>
    <button class="btn primary" id="share" type="button">Compartilhar resumo</button>
  </div>
  <footer>Dados guardados somente neste aparelho. Faça backup regularmente.</footer>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="sheet" id="modal-sheet"></div>
</div>
<input id="backup-file" type="file" accept="application/json,.json" hidden>

<script>
"use strict";
const STORAGE_KEY="acompanhar_producao_v2";
const TZ="America/Sao_Paulo";
const COMPONENTS=[{id:"cabedal",name:"Cabedal"},{id:"palmilha",name:"Palmilhas"},{id:"solado",name:"Solado"}];
const DEFAULTS={
  version:4,
  settings:{
    pairsPerSheet:72,pairsPerKit:6,
    models:[
      {id:"m501",name:"501",active:true},{id:"m506",name:"506",active:true},
      {id:"m507",name:"507",active:true},{id:"m509",name:"509",active:true},
      {id:"m601",name:"601",active:true}
    ],
    mountings:[
      {id:"bruno_barbara",name:"Bruno e Bárbara",rate:2.60,active:true},
      {id:"jeferson",name:"Jeferson",rate:4.00,active:true},
      {id:"legacy",name:"Não informado",rate:0,active:false}
    ],
    workDays:[1,2,3,4,5]
  },
  weeks:{},lastBackup:null,onboardingDone:false
};
let data=loadData();
let ui={tab:"week",viewWeek:null,editingEntry:null};
let toastTimer=null;

function clone(v){return JSON.parse(JSON.stringify(v))}
function loadData(){
  try{
    const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    if(!raw||typeof raw!=="object")return clone(DEFAULTS);
    const merged={...clone(DEFAULTS),...raw,settings:{...clone(DEFAULTS.settings),...(raw.settings||{})},weeks:raw.weeks||{}};
    merged.settings.models=normalizeItems(merged.settings.models,DEFAULTS.settings.models);
    merged.settings.mountings=normalizeMountings(merged.settings.mountings,DEFAULTS.settings.mountings);
    merged.settings.workDays=Array.isArray(merged.settings.workDays)?merged.settings.workDays.filter(n=>Number.isInteger(n)&&n>=0&&n<=6):[1,2,3,4,5];
    if(!merged.settings.mountings.some(x=>x.id==="legacy"))merged.settings.mountings.push({id:"legacy",name:"Não informado",rate:0,active:false});
    const defaultMounting="legacy";
    for(const w of Object.values(merged.weeks))for(const e of w.entries||[]){
      if(!e.mountingId)e.mountingId=defaultMounting;
      if(!e.mountingName)e.mountingName=merged.settings.mountings.find(x=>x.id===e.mountingId)?.name||"Montagem";
      if((e.kind==="palmilha"||e.kind==="solado")&&!e.line)e.line=modelLine(e.modelId,e.modelName,merged.settings.models);
    }
    merged.version=4;
    return merged;
  }catch(_){return clone(DEFAULTS)}
}
function normalizeItems(items,fallback){
  if(!Array.isArray(items)||!items.length)return clone(fallback);
  return items.filter(x=>x&&x.id&&x.name).map(x=>({id:String(x.id),name:String(x.name),active:x.active!==false}));
}
function normalizeMountings(items,fallback){
  if(!Array.isArray(items)||!items.length)return clone(fallback);
  return items.filter(x=>x&&x.id&&x.name).map(x=>({id:String(x.id),name:String(x.name),rate:Math.max(0,Number(x.rate)||0),active:x.active!==false}));
}
function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  document.getElementById("header-status").textContent="Salvo às "+new Intl.DateTimeFormat("pt-BR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}).format(new Date());
}
function spDate(date=new Date()){
  const parts=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date);
  const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
function addDays(iso,amount){const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+amount);return d.toISOString().slice(0,10)}
function dayOfWeek(iso){return new Date(iso+"T12:00:00Z").getUTCDay()}
function weekKeyFor(iso){const dow=dayOfWeek(iso);return addDays(iso,-((dow+6)%7))}
function currentWeekKey(){return weekKeyFor(spDate())}
function weekEnd(key){return addDays(key,6)}
function fmtDate(iso,short=false){if(!iso)return"";return new Intl.DateTimeFormat("pt-BR",short?{day:"2-digit",month:"2-digit"}:{day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date(iso+"T12:00:00Z"))}
function weekLabel(key){return `${fmtDate(key,true)} a ${fmtDate(weekEnd(key),false)}`}
const fmt=n=>Number(n||0).toLocaleString("pt-BR",{maximumFractionDigits:1});
const money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pct=n=>Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=prefix=>prefix+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const activeModels=()=>data.settings.models.filter(x=>x.active!==false);
const activeMountings=()=>data.settings.mountings.filter(x=>x.active!==false);
function modelsForWeek(key){
  const snapshot=data.weeks[key]?.modelSnapshot;
  return key===currentWeekKey()||!Array.isArray(snapshot)||!snapshot.length?activeModels():snapshot;
}
function mountingsForWeek(key){
  const w=data.weeks[key],snapshot=w?.mountingSnapshot;
  const ids=new Set((w?.entries||[]).map(e=>e.mountingId));
  if(key!==currentWeekKey()&&Array.isArray(snapshot)&&snapshot.length){
    const list=clone(snapshot),known=new Set(list.map(x=>x.id));
    for(const mt of data.settings.mountings)if(ids.has(mt.id)&&!known.has(mt.id))list.push(clone(mt));
    return list;
  }
  return data.settings.mountings.filter(x=>x.active!==false||ids.has(x.id));
}
function itemName(collection,id,fallback){return collection.find(x=>x.id===id)?.name||fallback||"Item removido"}
function modelLine(modelId,modelName,models){
  const list=models||data.settings.models,label=modelName||list.find(x=>x.id===modelId)?.name||modelId||"";
  const match=String(label).match(/\d/);return match?match[0]+"00":"Outros";
}
function entryLine(e){return e.line||modelLine(e.modelId,e.modelName)}
function availableLines(){return [...new Set(["300","500","600",...activeModels().map(m=>modelLine(m.id,m.name))])].sort()}
function possibleForMounting(mt){
  return Object.entries(mt.lines||{}).reduce((total,[line,parts])=>{
    const cabedais=Object.entries(mt.models||{}).reduce((sum,[id,m])=>sum+(modelLine(id,m.name)===line?Math.max(0,m.cabedal||0):0),0);
    return total+Math.max(0,Math.min(cabedais,parts.palmilha||0,parts.solado||0));
  },0);
}
function previousGoal(key){
  const keys=Object.keys(data.weeks).filter(k=>k<key&&Number(data.weeks[k]?.goal)>0).sort().reverse();
  return keys.length?Number(data.weeks[keys[0]].goal):null;
}
function ensureWeek(key=currentWeekKey()){
  if(!data.weeks[key])data.weeks[key]={goal:previousGoal(key),modelGoals:{},entries:[],modelSnapshot:clone(activeModels()),mountingSnapshot:clone(activeMountings()),createdAt:new Date().toISOString()};
  const w=data.weeks[key];
  if(!Array.isArray(w.entries))w.entries=[];
  if(!w.modelGoals||typeof w.modelGoals!=="object")w.modelGoals={};
  if(!Array.isArray(w.modelSnapshot))w.modelSnapshot=clone(activeModels());
  if(!Array.isArray(w.mountingSnapshot))w.mountingSnapshot=clone(activeMountings());
  return w;
}
function weekData(key){return ensureWeek(key)}
function syncCurrentSnapshots(){
  const w=ensureWeek(currentWeekKey());
  w.modelSnapshot=clone(activeModels());
  const ids=new Set((w.entries||[]).map(e=>e.mountingId));
  w.mountingSnapshot=clone(data.settings.mountings.filter(x=>x.active!==false||ids.has(x.id)));
}
function entryInWeek(e,key){return e.date>=key&&e.date<=weekEnd(key)}
function totalsFor(key){
  const w=weekData(key),models=modelsForWeek(key),mountings=mountingsForWeek(key),byModel=Object.fromEntries(models.map(m=>[m.id,0])),byMounting=Object.fromEntries(mountings.map(m=>[m.id,0]));
  const received=Object.fromEntries(COMPONENTS.map(c=>[c.id,0]));
  let done=0;
  for(const e of w.entries.filter(x=>entryInWeek(x,key))){
    if(e.kind==="finished"){done+=Number(e.qty)||0;if(Object.hasOwn(byModel,e.modelId))byModel[e.modelId]+=Number(e.qty)||0;if(Object.hasOwn(byMounting,e.mountingId))byMounting[e.mountingId]+=Number(e.qty)||0}
    if(Object.hasOwn(received,e.kind))received[e.kind]+=Number(e.qty)||0;
  }
  return{received,byModel,byMounting,done};
}
function inventoryByMountingUntil(date,excludeId=null,candidate=null){
  const stock={};
  const ensureMounting=id=>stock[id]||(stock[id]={models:{},lines:{}});
  const ensureModel=(mt,id,name)=>mt.models[id]||(mt.models[id]={name:name||itemName(data.settings.models,id),cabedal:0});
  const ensureLine=(mt,line)=>mt.lines[line]||(mt.lines[line]={palmilha:0,solado:0});
  const apply=e=>{
    if(!e||e.id===excludeId||e.date>date)return;
    const qty=Number(e.qty)||0,mt=ensureMounting(e.mountingId),line=entryLine(e);
    if(e.kind==="finished"){
      ensureModel(mt,e.modelId,e.modelName).cabedal-=qty;
      const shared=ensureLine(mt,line);shared.palmilha-=qty;shared.solado-=qty;
    }else if(e.kind==="cabedal")ensureModel(mt,e.modelId,e.modelName).cabedal+=qty;
    else if(e.kind==="palmilha"||e.kind==="solado")ensureLine(mt,line)[e.kind]+=qty;
  };
  for(const w of Object.values(data.weeks))for(const e of w.entries||[])apply(e);
  if(candidate)apply(candidate);
  for(const mt of data.settings.mountings)ensureMounting(mt.id);
  for(const mt of Object.values(stock)){
    for(const m of data.settings.models)ensureModel(mt,m.id,m.name);
    for(const line of availableLines())ensureLine(mt,line);
  }
  return stock;
}
function inventoryUntil(date){

    const line=modelLine(m.id,m.name);

      palmilha:Object.values(byMounting).reduce((sum,mt)=>sum+(mt.lines[line]?.palmilha||0),0),
      solado:Object.values(byMounting).reduce((sum,mt)=>sum+(mt.lines[line]?.solado||0),0),
      line

  }));
}
function stockAfterChange(mountingId,modelId,excludeId,candidate){
  const stock=inventoryByMountingUntil("9999-12-31",excludeId,candidate),mt=stock[mountingId]||{models:{},lines:{}};
  const line=candidate?.line||modelLine(modelId,candidate?.modelName),model=mt.models[modelId]||{},shared=mt.lines[line]||{};
  return{cabedal:model.cabedal||0,palmilha:shared.palmilha||0,solado:shared.solado||0};

function stockProblems(excludeId,candidate){
  const stock=inventoryByMountingUntil("9999-12-31",excludeId,candidate),missing=new Set();
  for(const mt of Object.values(stock)){
    for(const m of Object.values(mt.models))if((m.cabedal||0)<0)missing.add("cabedal");

function workdayStats(key,readOnly=false){
  const days=data.settings.workDays,today=spDate(),end=weekEnd(key);
  let elapsed=0,remaining=0,total=0;
  for(let i=0;i<7;i++){
    const d=addDays(key,i);if(!days.includes(dayOfWeek(d)))continue;total++;

  if(key>currentWeekKey()){elapsed=0;remaining=total}
  return{elapsed,remaining,total};
}
function weekSummary(key){
  const w=weekData(key),t=totalsFor(key),goal=Number(w.goal)||0,stock=inventoryUntil(weekEnd(key)),stockByMounting=inventoryByMountingUntil(weekEnd(key));
  const componentTotals={
    cabedal:Object.values(stockByMounting).reduce((sum,mt)=>sum+Object.values(mt.models).reduce((a,m)=>a+Math.max(0,m.cabedal||0),0),0),
    palmilha:Object.values(stockByMounting).reduce((sum,mt)=>sum+Object.values(mt.lines).reduce((a,line)=>a+Math.max(0,line.palmilha||0),0),0),
    solado:Object.values(stockByMounting).reduce((sum,mt)=>sum+Object.values(mt.lines).reduce((a,line)=>a+Math.max(0,line.solado||0),0),0)
  };
  const gargalo=COMPONENTS.reduce((a,b)=>componentTotals[b.id]<componentTotals[a.id]?b:a,COMPONENTS[0]);
  const possible=Object.values(stockByMounting).reduce((total,mt)=>total+possibleForMounting(mt),0);

function mountingSettingsItem(item,index,total){
  const rate=Number(item.rate||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
  return `<div class="setting-item mounting-item"><input value="${esc(item.name)}" data-name-id="${item.id}" data-type="mountings" aria-label="Nome da montagem"><div class="rate-field"><input value="${rate}" inputmode="decimal" data-rate-id="${item.id}" aria-label="Valor por par"></div><div class="mini-actions"><button data-move="up" data-id="${item.id}" data-type="mountings" ${index===0?"disabled":""} aria-label="Mover para cima">↑</button><button data-move="down" data-id="${item.id}" data-type="mountings" ${index===total-1?"disabled":""} aria-label="Mover para baixo">↓</button><button class="remove" data-remove="${item.id}" data-type="mountings" aria-label="Remover">×</button></div></div>`;
}
function backupStatus(){
  if(!data.lastBackup)return{warn:true,text:"Nenhum backup feito ainda."};
  const days=Math.floor((Date.now()-new Date(data.lastBackup).getTime())/86400000);
  return{warn:days>7,text:`Último backup: ${new Intl.DateTimeFormat("pt-BR",{timeZone:TZ,dateStyle:"short",timeStyle:"short"}).format(new Date(data.lastBackup))}${days>7?" · faça um novo backup":""}`};
}
function renderSettings(){
  const models=activeModels(),mountings=activeMountings(),bs=backupStatus(),days=[{n:1,l:"Seg"},{n:2,l:"Ter"},{n:3,l:"Qua"},{n:4,l:"Qui"},{n:5,l:"Sex"},{n:6,l:"Sáb"},{n:0,l:"Dom"}];
  document.getElementById("tab-settings").innerHTML=`
    <div class="block"><h2>Padrões da fábrica</h2><p class="sub">Esses valores alimentam os botões rápidos e a conversão em fichas.</p><div class="form-grid"><div class="field"><label for="pairs-sheet">Pares por ficha</label><input id="pairs-sheet" inputmode="numeric" value="${data.settings.pairsPerSheet}"></div><div class="field"><label for="pairs-kit">Pares por kit</label><input id="pairs-kit" inputmode="numeric" value="${data.settings.pairsPerKit}"></div></div><button class="btn primary full" id="save-patterns">Salvar padrões</button></div>
    <div class="block"><h2>Componentes controlados</h2><p class="sub">Cada par pronto baixa um cabedal do modelo e uma palmilha e um solado da linha correspondente, sempre na mesma montagem.</p><div class="summary-grid">${COMPONENTS.map(c=>`<div class="summary-stat"><strong>${esc(c.name)}</strong><span>controle em pares</span></div>`).join("")}</div></div>
    <div class="block"><h2>Montagens</h2><p class="sub">Defina as equipes e o valor pago por par pronto. Os valores das semanas anteriores ficam preservados.</p><div class="settings-list">${mountings.map((x,i)=>mountingSettingsItem(x,i,mountings.length)).join("")}</div><button class="btn full" id="add-mounting">Adicionar montagem</button></div>
    <div class="block"><h2>Modelos</h2><div class="settings-list">${models.map((x,i)=>settingsItem(x,"models",i,models.length)).join("")}</div><button class="btn full" data-add-item="models">Adicionar modelo</button></div>
    <div class="block"><h2>Dias de trabalho</h2><p class="sub">A semana sempre começa na segunda-feira.</p><div class="days">${days.map(d=>`<label class="day-check"><input type="checkbox" value="${d.n}" ${data.settings.workDays.includes(d.n)?"checked":""}><span>${d.l}</span></label>`).join("")}</div><button class="btn primary full" id="save-days">Salvar dias</button></div>
    <div class="block"><h2>Backup</h2><p class="sub">O backup protege os dados se o iPhone for trocado, restaurado ou perder os dados do Safari.</p><div class="button-row"><button class="btn" id="export-backup">Exportar backup</button><button class="btn" id="import-backup">Importar backup</button></div><div class="backup-status ${bs.warn?"warn":""}">${esc(bs.text)}</div></div>
    <div class="block install-help"><h2>Instalar no iPhone</h2><p class="sub">No Safari, toque em Compartilhar e depois em Adicionar à Tela de Início.</p></div>`;
  document.getElementById("save-patterns").onclick=savePatterns;
  document.getElementById("save-days").onclick=saveDays;
  document.querySelectorAll("[data-name-id]").forEach(i=>i.onchange=()=>renameItem(i.dataset.type,i.dataset.nameId,i.value));
  document.querySelectorAll("[data-rate-id]").forEach(i=>i.onchange=()=>saveMountingRate(i.dataset.rateId,i.value));
  document.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>moveItem(b.dataset.type,b.dataset.id,b.dataset.move));
  document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>removeItem(b.dataset.type,b.dataset.remove));
  document.querySelectorAll("[data-add-item]").forEach(b=>b.onclick=()=>addItem(b.dataset.addItem));
  document.getElementById("add-mounting").onclick=addMounting;
  document.getElementById("export-backup").onclick=exportBackup;
  document.getElementById("import-backup").onclick=()=>document.getElementById("backup-file").click();
}
function savePatterns(){
  const a=document.getElementById("pairs-sheet").value.trim(),b=document.getElementById("pairs-kit").value.trim();
  if(!/^\d+$/.test(a)||Number(a)<=0||!/^\d+$/.test(b)||Number(b)<=0){showToast("Use números inteiros maiores que zero.");return}
  data.settings.pairsPerSheet=Number(a);data.settings.pairsPerKit=Number(b);save();render();showToast("Padrões atualizados.");
}
function saveDays(){
  const checked=[...document.querySelectorAll(".day-check input:checked")].map(x=>Number(x.value));
  if(!checked.length){showToast("Marque pelo menos um dia de trabalho.");return}
  data.settings.workDays=checked;save();render();showToast("Dias de trabalho atualizados.");
}
function parseMoney(value){const raw=String(value).trim();return Number(raw.includes(",")?raw.replace(/\./g,"").replace(",","."):raw)}
function saveMountingRate(id,value){
  const rate=parseMoney(value);if(!Number.isFinite(rate)||rate<0){renderSettings();showToast("Digite um valor válido por par.");return}
  const item=data.settings.mountings.find(x=>x.id===id);if(item){item.rate=Math.round(rate*100)/100;syncCurrentSnapshots();save();render();showToast("Valor por par atualizado.")}
}
function renameItem(type,id,value){
  value=value.trim();if(!value){renderSettings();showToast("O nome não pode ficar vazio.");return}
  const item=data.settings[type].find(x=>x.id===id);if(item){item.name=value;syncCurrentSnapshots();save();render();showToast("Nome atualizado.")}
}
function moveItem(type,id,direction){
  const all=data.settings[type],active=all.filter(x=>x.active!==false),from=active.findIndex(x=>x.id===id),to=direction==="up"?from-1:from+1;if(from<0||to<0||to>=active.length)return;
  const a=all.indexOf(active[from]),b=all.indexOf(active[to]);[all[a],all[b]]=[all[b],all[a]];syncCurrentSnapshots();save();render();
}
function removeItem(type,id){
  const active=data.settings[type].filter(x=>x.active!==false),label=type==="mountings"?"uma montagem":"um modelo";if(active.length<=1){showToast(`Mantenha pelo menos ${label}.`);return}
  const item=data.settings[type].find(x=>x.id===id);
  confirmAction({title:`Remover ${type==="mountings"?"montagem":"modelo"}?`,message:`${item.name} deixará de aparecer nos novos lançamentos. Os registros antigos serão preservados.`,confirmText:"Remover",danger:true,onConfirm:()=>{item.active=false;syncCurrentSnapshots();save();render();showToast("Item removido.")}});
}
function addItem(type){
  const label=type==="stages"?"etapa":"modelo";
  showModal(`<h2 id="modal-title">Adicionar ${label}</h2><div class="field"><label for="new-item">Nome</label><input id="new-item" autocomplete="off"></div><div class="button-row"><button class="btn" data-modal-close>Cancelar</button><button class="btn primary" id="confirm-add">Adicionar</button></div>`);
  document.getElementById("confirm-add").onclick=()=>{const name=document.getElementById("new-item").value.trim();if(!name){showToast("Digite um nome.");return}data.settings[type].push({id:uid(type==="stages"?"s":"m"),name,active:true});syncCurrentSnapshots();save();closeModal();render();showToast("Item adicionado.")};
}
function addMounting(){
  showModal(`<h2 id="modal-title">Adicionar montagem</h2><div class="field"><label for="new-mounting">Nome</label><input id="new-mounting" autocomplete="off" placeholder="Nome da equipe"></div><div class="field"><label for="new-rate">Valor por par</label><input id="new-rate" inputmode="decimal" placeholder="Ex.: 3,50"></div><div class="button-row"><button class="btn" data-modal-close>Cancelar</button><button class="btn primary" id="confirm-mounting">Adicionar</button></div>`);
  document.getElementById("confirm-mounting").onclick=()=>{const name=document.getElementById("new-mounting").value.trim(),rate=parseMoney(document.getElementById("new-rate").value);if(!name){showToast("Digite o nome da montagem.");return}if(!Number.isFinite(rate)||rate<0){showToast("Digite um valor válido por par.");return}data.settings.mountings.push({id:uid("mt"),name,rate:Math.round(rate*100)/100,active:true});syncCurrentSnapshots();save();closeModal();render();showToast("Montagem adicionada.")};
}
function exportBackup(){
  data.lastBackup=new Date().toISOString();save();
  const payload={app:"acompanhar-producao",exportedAt:data.lastBackup,data:clone(data)};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`acompanhar-producao-backup-${spDate()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);render();showToast("Backup exportado.");
}
function validBackup(obj){return obj&&obj.app==="acompanhar-producao"&&obj.data&&obj.data.settings&&Array.isArray(obj.data.settings.models)&&obj.data.weeks&&typeof obj.data.weeks==="object"}
async function importBackup(file){
  try{
    const parsed=JSON.parse(await file.text());if(!validBackup(parsed))throw new Error("Arquivo incompatível");
    confirmAction({title:"Substituir todos os dados?",message:"A importação apagará os dados atuais deste aparelho e colocará os dados do backup no lugar.",confirmText:"Importar e substituir",danger:true,onConfirm:()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(parsed.data));data=loadData();ui={tab:"week",viewWeek:null,editingEntry:null};save();switchTab("week");showToast("Backup importado.")}});
  }catch(e){showToast("Este arquivo não é um backup válido do app.")}
  finally{document.getElementById("backup-file").value=""}
}
function shareText(){
  const key=currentWeekKey(),s=weekSummary(key),mountings=mountingsForWeek(key);
  return[
    "ACOMPANHAR PRODUÇÃO",`Semana: ${weekLabel(key)}`,`Meta: ${s.goal?fmt(s.goal)+" pares":"não definida"}`,"",
    "COMPONENTES DISPONÍVEIS",...COMPONENTS.map(c=>`${c.name}: ${fmt(s.componentTotals[c.id]||0)} pares`),"",
    "POR MONTAGEM",...mountings.map(mt=>`${mt.name}: ${fmt(s.byMounting[mt.id]||0)} pares · ${money((s.byMounting[mt.id]||0)*(Number(mt.rate)||0))}`),"",
    `Pares prontos: ${fmt(s.done)}${s.goal?` · ${pct(s.rate)}`:""}`,`Pode produzir agora: ${fmt(s.possible)} pares`,`Gargalo: ${s.gargalo?.name||"—"}`,`Projeção: ${fmt(s.projection)} pares no ritmo atual`
  ].join("\n");
}
async function share(){
  const text=shareText();
  try{if(navigator.share)await navigator.share({title:"Acompanhar Produção",text});else window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank","noopener,noreferrer")}
  catch(e){if(e.name!=="AbortError"){try{await navigator.clipboard.writeText(text);showToast("Resumo copiado.")}catch(_){showToast("Não foi possível compartilhar.")}}}
}
function switchTab(tab){
  ui.tab=tab;document.querySelectorAll("nav [role=tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  ["week","entry","history","settings"].forEach(k=>document.getElementById("tab-"+k).hidden=k!==tab);
  document.querySelector(".actions").hidden=tab!=="week";render();
}
function render(){
  ensureWeek();
  if(ui.tab==="week")renderWeek();
  if(ui.tab==="entry")renderEntry();
  if(ui.tab==="history")renderHistory();
  if(ui.tab==="settings")renderSettings();
}
function makeIcon(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><rect width="180" height="180" rx="38" fill="#18212e"/><path d="M45 126V96h20v30H45zm35 0V69h20v57H80zm35 0V44h20v82h-20z" fill="#edf0f3"/><circle cx="135" cy="44" r="9" fill="#c98a00"/></svg>`;
  document.getElementById("app-icon").href="data:image/svg+xml,"+encodeURIComponent(svg);
  const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");canvas.width=canvas.height=180;
  ctx.fillStyle="#18212e";ctx.beginPath();ctx.roundRect(0,0,180,180,38);ctx.fill();ctx.fillStyle="#edf0f3";ctx.fillRect(45,96,20,30);ctx.fillRect(80,69,20,57);ctx.fillRect(115,44,20,82);ctx.fillStyle="#c98a00";ctx.beginPath();ctx.arc(135,44,9,0,Math.PI*2);ctx.fill();
  document.getElementById("apple-icon").href=canvas.toDataURL("image/png");
}
document.querySelectorAll("nav [role=tab]").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
document.getElementById("edit-goal").onclick=goalModal;
document.getElementById("share").onclick=share;
document.getElementById("backup-file").onchange=e=>{const f=e.target.files?.[0];if(f)importBackup(f)};
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal"||e.target.closest("[data-modal-close]"))closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("modal").hidden)closeModal()});
makeIcon();render();
if(!data.onboardingDone)setTimeout(onboarding,80);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

<!-- STOCK_PANEL_V1 -->
<script>
(function stockPanelBootstrap(catalog, catalogUpdatedAt){
  const STOCK_SECTORS=[
    {id:"cabedal",name:"Cabedal",costKey:"cabedal"},
    {id:"solado",name:"Solados",costKey:"solado"},
    {id:"palmilha",name:"Palmilhas",costKey:"palmilha"},
    {id:"produto_pronto",name:"Produto pronto",costKey:"total"}
  ];
  const CATALOG=Object.fromEntries(catalog.map(x=>[String(x.ref),x]));
  const refs=Object.values(CATALOG).sort((a,b)=>String(a.ref).localeCompare(String(b.ref),"pt-BR",{numeric:true}));
  if(!Array.isArray(data.stockLedger))data.stockLedger=[];
  data.stockCatalogUpdatedAt=catalogUpdatedAt;

  const stockFmt=n=>Number(n||0).toLocaleString("pt-BR",{maximumFractionDigits:2});
  const stockMoney=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const parseQty=v=>{
    const raw=String(v??"").trim().replace(/\s/g,"");
    if(!raw)return NaN;
    return Number(raw.includes(",")?raw.replace(/\./g,"").replace(",","."):raw);
  };
  const sectorById=id=>STOCK_SECTORS.find(s=>s.id===id);
  const normalizeColor=value=>{
    const raw=String(value||"").trim();
    if(!raw)return"";
    const k=raw.toLocaleLowerCase("pt-BR").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    if(k==="preto")return"Preto";
    if(k==="rose"||k==="rosa")return"Rose";
    if(k==="off"||k==="off white"||k==="off-white"||k==="branco")return"Off White";
    if(k==="caramelo")return"Caramelo";
    if(k==="ouro"||k==="ouro light"||k==="ourolight")return"Ouro Light";
    return raw.replace(/\s+/g," ");
  };
  const movementDelta=m=>(m.direction==="out"?-1:1)*(Number(m.qty)||0);
  const itemKey=(sector,ref,color)=>[sector,String(ref),normalizeColor(color).toLocaleLowerCase("pt-BR")].join("|");
  const linePoolRef=line=>`@line:${String(line||"Outros")}`;
  const displayRef=ref=>String(ref||"").startsWith("@line:")?`Linha ${String(ref).slice(6)}`:String(ref||"")||"Sem referência";

  function refFromEntry(e){
    if(!e)return"";
    const candidates=[e.stockRef,e.modelName,e.modelId?itemName(data.settings.models,e.modelId,""):""];
    for(const value of candidates){
      const m=String(value||"").toUpperCase().match(/\b\d{3}R?\b/);
      if(m&&CATALOG[m[0]])return m[0];
    }
    return"";
  }
  function ensureBalanceRow(map,sector,ref,color){
    const normalizedColor=normalizeColor(color)||"Sem cor";
    const key=itemKey(sector,ref,normalizedColor);
    if(!map.has(key))map.set(key,{sector,ref:String(ref),color:normalizedColor,qty:0});
    return map.get(key);
  }
  function addBalance(map,sector,ref,color,qty){
    const row=ensureBalanceRow(map,sector,ref,color);
    row.qty+=(Number(qty)||0);
    return row;
  }
  function consumeBalance(map,{sector,ref,line,color,qty,allowLineFallback=false},issues){
    let remaining=Number(qty)||0;
    if(remaining<=0)return;
    const wantedColor=normalizeColor(color)||"Sem cor";
    const exactRef=String(ref||"");
    const lineRef=linePoolRef(line);
    const candidateRows=()=>[...map.values()].filter(r=>r.sector===sector&&r.qty>0.00001);
    const takeWhere=predicate=>{
      for(const row of candidateRows().filter(predicate)){
        if(remaining<=0)break;
        const take=Math.min(row.qty,remaining);
        row.qty-=take;remaining-=take;
      }
    };
    if(exactRef){
      takeWhere(r=>r.ref===exactRef&&r.color===wantedColor);
      takeWhere(r=>r.ref===exactRef&&r.color==="Sem cor");
      takeWhere(r=>r.ref===exactRef);
    }
    if(allowLineFallback){
      const lineCode=String(line||"");
      const rowLineCode=r=>{
        if(String(r.ref).startsWith("@line:"))return String(r.ref).slice(6);
        const raw=CATALOG[r.ref]?.line||"";
        const m=String(raw).match(/\d{3}/);
        return m?m[0]:"";
      };
      takeWhere(r=>r.ref===lineRef&&r.color===wantedColor);
      takeWhere(r=>r.ref===lineRef&&r.color==="Sem cor");
      takeWhere(r=>r.ref===lineRef);
      takeWhere(r=>rowLineCode(r)===lineCode&&r.color===wantedColor);
      takeWhere(r=>rowLineCode(r)===lineCode&&r.color==="Sem cor");
      takeWhere(r=>rowLineCode(r)===lineCode);
    }
    if(remaining>0.00001)issues.push(`${sectorById(sector)?.name||sector}: faltaram ${stockFmt(remaining)} pares para baixar na Ref. ${displayRef(exactRef||lineRef)}.`);
  }
  function productionBalanceState(){
    const map=new Map(),issues=[];
    const events=[];
    for(const w of Object.values(data.weeks||{}))for(const e of w.entries||[])events.push(e);
    events.sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))||String(a.createdAt||"").localeCompare(String(b.createdAt||"")));
    for(const e of events){
      const qty=Number(e.qty)||0;
      if(qty<=0)continue;
      const color=normalizeColor(e.color)||"Sem cor";
      const ref=refFromEntry(e);
      const line=entryLine(e);
      if(e.kind==="cabedal"){
        addBalance(map,"cabedal",ref||"@sem-ref",color,qty);
      }else if(e.kind==="palmilha"||e.kind==="solado"){
        addBalance(map,e.kind,ref||linePoolRef(line),color,qty);
      }else if(e.kind==="finished"){
        const sheet=CATALOG[ref];
        consumeBalance(map,{sector:"cabedal",ref,line,color,qty,allowLineFallback:false},issues);
        consumeBalance(map,{sector:"solado",ref,line,color,qty,allowLineFallback:true},issues);
        if(sheet?.usesPalmilha!==false)consumeBalance(map,{sector:"palmilha",ref,line,color,qty,allowLineFallback:true},issues);
        addBalance(map,"produto_pronto",ref||"@sem-ref",color,qty);
      }
    }
    return{map,issues};
  }
  function balanceState(excludeId=null){
    const state=productionBalanceState(),map=state.map;
    for(const m of data.stockLedger){
      if(!m||m.id===excludeId)continue;
      addBalance(map,m.sector,m.ref,normalizeColor(m.color)||"Sem cor",movementDelta(m));
    }
    return{rows:[...map.values()],issues:state.issues};
  }
  function balances(excludeId=null){return balanceState(excludeId).rows}

  function costInfo(sector,ref){
    if(String(ref).startsWith("@line:"))return{ok:false,message:`Saldo antigo lançado apenas pela ${displayRef(ref)}. Falta a referência para aplicar o custo correto.`};
    if(String(ref).startsWith("@"))return{ok:false,message:"Lançamento sem referência identificável. Informe a referência para valorizar este saldo."};
    const sheet=CATALOG[String(ref)];
    const sectorInfo=sectorById(sector);
    if(!sheet)return{ok:false,message:"Referência sem ficha de custo cadastrada."};
    if(sector==="palmilha"&&!sheet.usesPalmilha)return{ok:false,blocked:true,message:"Esta referência não usa palmilha."};
    if(sector==="produto_pronto"&&!sheet.complete){
      return{ok:false,message:sheet.alert||"Ficha com custos incompletos. O produto pronto não será valorizado até a ficha ser concluída."};
    }
    const value=sheet[sectorInfo.costKey];
    if(value===null||value===undefined||value===""||!Number.isFinite(Number(value))){
      return{ok:false,message:`Falta custo de ${sectorInfo.name.toLocaleLowerCase("pt-BR")} na ficha da Ref. ${sheet.ref}.`};
    }
    return{ok:true,cost:Number(value),sheet};
  }

  function quantityText(pairs){
    const kits=pairs/(Number(data.settings.pairsPerKit)||6);
    const sheets=pairs/(Number(data.settings.pairsPerSheet)||72);
    return `${stockFmt(pairs)} pares · ${stockFmt(kits)} kits · ${stockFmt(sheets)} fichas`;
  }

  function summary(){
    const state=balanceState(),positive=state.rows.filter(x=>x.qty>0.00001);
    const bySector={};
    let totalKnown=0,totalPending=0;
    for(const s of STOCK_SECTORS)bySector[s.id]={pairs:0,value:0,pendingPairs:0,items:[]};
    for(const row of positive){
      const box=bySector[row.sector]||(bySector[row.sector]={pairs:0,value:0,pendingPairs:0,items:[]});
      const ci=costInfo(row.sector,row.ref);
      const item={...row,costInfo:ci,value:ci.ok?row.qty*ci.cost:null};
      box.pairs+=row.qty;
      if(ci.ok){box.value+=item.value;totalKnown+=item.value}else{box.pendingPairs+=row.qty;totalPending+=row.qty}
      box.items.push(item);
    }
    return{bySector,totalKnown,totalPending,positive,issues:state.issues};
  }

  function renderStock(){
    const root=document.getElementById("tab-stock");
    if(!root)return;
    const s=summary();
    const hasAny=s.positive.length>0;
    const updated=new Intl.DateTimeFormat("pt-BR",{dateStyle:"short",timeStyle:"short",timeZone:TZ}).format(new Date(catalogUpdatedAt));
    const sectorCards=STOCK_SECTORS.map(sec=>{
      const box=s.bySector[sec.id];
      return `<div class="stock-sector-card">
        <div class="stock-sector-head"><strong>${esc(sec.name)}</strong><span>${stockFmt(box.pairs)} pares</span></div>
        <div class="stock-big">${stockMoney(box.value)}${box.pendingPairs?'<span class="stock-pending"> + pendente</span>':""}</div>
        <div class="stock-muted">${quantityText(box.pairs)}</div>

          </div>`;

      </div>`;
    }).join("");

    function qtyPairs(){
      const q=parseQty(qtyEl.value);

      const factor=unitEl.value==="kits"?(Number(data.settings.pairsPerKit)||6):unitEl.value==="sheets"?(Number(data.settings.pairsPerSheet)||72):1;
      return q*factor;
    }

      const pairs=qtyPairs();

      if(!ci.ok){hint.innerHTML=`<span class="stock-warning-inline">⚠ ${esc(ci.message)}</span>`;return}
      if(Number.isFinite(pairs)&&Math.abs(pairs-Math.round(pairs))<.000001){
        hint.innerHTML=`Custo unitário: <strong>${stockMoney(ci.cost)}</strong> · ${stockFmt(pairs)} pares × ${stockMoney(ci.cost)} = <strong>${stockMoney(pairs*ci.cost)}</strong>`;
      }else{
        hint.innerHTML=`Custo unitário deste setor: <strong>${stockMoney(ci.cost)}</strong>`;
      }
    }

    qtyEl.oninput=refreshHint;

      const color=normalizeColor(document.getElementById("stock-color").value);
      const note=document.getElementById("stock-note").value.trim();
      const pairs=qtyPairs();
      const ci=costInfo(sector,ref);
      if(!date){showToast("Escolha a data.");return}
      if(!color){showToast("Informe a cor.");return}
      if(!Number.isFinite(pairs)||pairs<=0||Math.abs(pairs-Math.round(pairs))>.000001){showToast("A quantidade precisa resultar em um número inteiro de pares.");return}
      if(ci.blocked){showToast(ci.message);return}
      const qty=Math.round(pairs);
      if(direction==="out"){
        const current=balances().find(x=>itemKey(x.sector,x.ref,x.color)===itemKey(sector,ref,color))?.qty||0;
        if(qty>current){showToast(`Saldo insuficiente: há ${stockFmt(current)} pares neste item.`);return}

    };

      const after=balances(id);
      const key=itemKey(movement.sector,movement.ref,movement.color);

    });

    document.querySelector(".actions").hidden=tab!=="week";
    render();
  };
