<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhar Produção</title>
<meta name="theme-color" content="#18212e">
<meta name="application-name" content="Acompanhar Produção">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Produção">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" id="app-icon" type="image/svg+xml">
<link rel="apple-touch-icon" id="apple-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3;--card:#FFFFFF;--ink:#18212E;--soft:#5B6878;--line:#D5DBE2;
  --bar:#2C5A86;--bar2:#9AAFC4;--track:#E3E8EE;--live:#C98A00;--danger:#A53B3B;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121821;--card:#1B2330;--ink:#E8EDF3;--soft:#9AA7B6;--line:#2C3644;--bar:#6FA3D6;--bar2:#4A5D73;--track:#263040;--live:#E6B33A;--danger:#F08A8A}
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select{font:inherit}
button{touch-action:manipulation}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:4px 0 14px}
h1{font-size:1.6rem;font-weight:800;font-stretch:80%;margin:0;letter-spacing:-.01em}
.status{font-size:.82rem;color:var(--soft);text-align:right;max-width:48%}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:6px;vertical-align:middle}
/* NAV_SCROLL_V1 */
nav{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:8}
nav button{flex:1;min-width:72px;border:0;background:transparent;color:var(--soft);font-weight:600;padding:11px 3px;border-radius:7px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,.week-card:focus-visible{outline:3px solid var(--live);outline-offset:2px}
.block{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.block h2{font-size:1.1rem;margin:0 0 4px;font-weight:700}
.sub{color:var(--soft);font-size:.85rem;margin:0 0 10px}
.meter{margin:2px 0 18px}
.meter-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.meter-num{font-size:3rem;font-weight:800;font-stretch:75%;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.meter-num small{font-size:1rem;font-weight:600;letter-spacing:0}
.meter-cap{color:var(--soft);font-size:.9rem;text-align:right}
.meter-track,.bar{background:var(--track);border-radius:3px;overflow:hidden}
.meter-track{height:14px;margin-top:8px}
.meter-fill,.bar span{display:block;height:100%;background:var(--bar);transition:width .35s ease}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.summary-stat{padding:10px;background:var(--track);border-radius:7px;min-width:0}
.summary-stat strong{display:block;font-size:1.08rem;font-variant-numeric:tabular-nums}
.summary-stat span{color:var(--soft);font-size:.78rem}
.row{padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.name{font-weight:650;min-width:0}
.value{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.votes{color:var(--soft);font-size:.8rem;font-variant-numeric:tabular-nums;margin-top:2px}
.bar{height:7px;margin-top:6px}.bar.secondary span{background:var(--bar2)}
.tag{display:inline-block;font-size:.72rem;font-weight:750;padding:2px 6px;border-radius:4px;background:var(--live);color:#1A1200;margin-left:6px;vertical-align:1px}
.notice{padding:11px 12px;border-left:4px solid var(--live);background:var(--track);border-radius:0 7px 7px 0;font-size:.88rem;margin-bottom:14px}
.readonly{display:flex;justify-content:space-between;align-items:center;gap:10px}
.field{margin-bottom:13px}.field label,.legend{display:block;color:var(--soft);font-size:.84rem;margin-bottom:5px}
input,select{width:100%;min-height:46px;padding:10px 11px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type="date"]{min-height:46px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-3px 0 13px}
.btn,.quick button,.icon-btn{min-height:46px;padding:10px 13px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font-weight:650;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger,.icon-btn.danger{color:var(--danger)}
.btn.full{width:100%}.btn.small{min-height:38px;padding:7px 10px;font-size:.85rem}
.button-row{display:flex;gap:8px;flex-wrap:wrap}.button-row .btn{flex:1}
.entry-actions{display:flex;gap:6px;flex-shrink:0}.entry-actions .icon-btn{min-height:38px;padding:6px 9px;font-size:.8rem}
.entry-main{min-width:0}.entry-title{font-weight:700}.entry-meta{color:var(--soft);font-size:.8rem}
.week-card{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:8px;cursor:pointer}
.week-card-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.week-card strong{font-size:1rem}.week-card .pct{font-size:1.05rem;font-weight:800}
.empty{color:var(--soft);font-size:.9rem;padding:18px 0;text-align:center}
.settings-list{margin:10px 0}.setting-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.setting-item:first-child{border-top:0}.setting-item input{min-height:42px}
.mounting-item{grid-template-columns:minmax(0,1fr) 112px auto}.mounting-item .rate-field{position:relative}.mounting-item .rate-field::before{content:"R$";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--soft);font-size:.78rem}.mounting-item .rate-field input{padding-left:32px}
.mini-actions{display:flex;gap:5px}.mini-actions button{min-width:40px;min-height:40px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);cursor:pointer}
.mini-actions .remove{color:var(--danger)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0}
.day-check{position:relative}.day-check input{position:absolute;opacity:0;pointer-events:none}.day-check span{display:grid;place-items:center;min-height:44px;border:1px solid var(--line);border-radius:7px;color:var(--soft);font-weight:650;cursor:pointer}
.day-check input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.backup-status{font-size:.83rem;color:var(--soft);margin-top:8px}.backup-status.warn{color:var(--live);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;width:min(calc(100% - 32px),520px);padding:11px 14px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:.9rem;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.22)}
.toast[hidden],.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:grid;place-items:end center;padding:16px}
.sheet{width:min(100%,520px);max-height:88vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:16px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.sheet h2{margin:0 0 7px;font-size:1.25rem}.sheet p{margin:0 0 12px}.sheet ul{padding-left:20px;color:var(--soft)}
.calc{font-size:.86rem;color:var(--soft);padding:9px 10px;background:var(--track);border-radius:7px;margin:8px 0}
.gargalo{border-color:var(--live)}
.model-goal-grid{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:8px;align-items:center;padding:6px 0}.model-goal-grid label{font-size:.9rem}
.actions{display:flex;gap:8px;margin:0 0 12px}.actions .btn{flex:1}
footer{color:var(--soft);font-size:.78rem;text-align:center;padding:8px 0 24px}
@media(max-width:400px){.wrap{padding:12px}.meter-num{font-size:2.65rem}nav button{font-size:.82rem}.form-grid{grid-template-columns:1fr}.summary-grid{gap:8px}.summary-stat{padding:9px}.days{grid-template-columns:repeat(4,1fr)}.mounting-item{grid-template-columns:minmax(0,1fr) 100px}.mounting-item .mini-actions{grid-column:1/-1;justify-content:flex-end}}
@media(prefers-reduced-motion:reduce){.meter-fill,.bar span{transition:none}}
@media(display-mode:standalone){.install-help{display:none}}

/* STOCK_PANEL_V1 */
.stock-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stock-sector-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px}
.stock-sector-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:.9rem}
.stock-sector-head span{color:var(--soft);font-size:.78rem;white-space:nowrap}
.stock-big{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;margin:8px 0 3px}
.stock-total{border-color:var(--ink)}
.stock-total-value{font-size:2.25rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stock-muted{color:var(--soft);font-size:.78rem}
.stock-pending{font-size:.72rem;color:var(--live);font-weight:750}
.stock-warning{margin-top:8px;padding:8px 9px;border-radius:7px;background:var(--track);color:var(--live);font-size:.8rem;font-weight:650}
.stock-warning-inline{color:var(--live);font-weight:700}
.stock-detail .calc strong{color:var(--ink)}
@media(max-width:520px){.stock-grid{grid-template-columns:1fr}.stock-sector-card{padding:12px}}

/* SIMPLE_DASHBOARD_V1: keep sync feedback visible while reading any tab. */
.app-chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);padding-top:1px;padding-bottom:1px}
.app-chrome nav{position:static;margin-bottom:14px}
.app-chrome header{align-items:center}
.app-chrome .status{overflow-wrap:anywhere}
.dashboard-heading{margin:0 0 12px;color:var(--soft);font-size:.85rem}
.dashboard-count{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;margin:10px 0 0}
.dashboard-count small{font-size:1rem;font-weight:600}
.dashboard-quantity{font-size:.85rem;color:var(--soft);margin-bottom:10px}
.dashboard-model .name{display:block}
.dashboard-model .model-description{display:block;font-weight:400;font-size:.85rem;color:var(--soft);margin-top:2px}
.dashboard-model .value{font-size:1rem}
.mounting-card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:12px}
.mounting-card h3{font-size:1rem;margin:0}
.mounting-card .mounting-total{font-size:.8rem;color:var(--soft);margin:4px 0 8px}
.dashboard-details>summary,.mounting-materials>summary{cursor:pointer;min-height:44px;align-content:center;font-weight:650}
.dashboard-details>summary:focus-visible,.mounting-materials>summary:focus-visible{outline:3px solid var(--live);outline-offset:2px}
.dashboard-details[open]>summary{margin-bottom:12px}
.mounting-materials{border-top:1px solid var(--line);margin-top:10px;padding-top:3px;font-size:.85rem}
.mounting-materials .row-top{flex-wrap:wrap}
.dashboard-alert{border-color:var(--danger);color:var(--ink)}
.dashboard-alert summary{cursor:pointer;margin-top:6px}
.dashboard-alert ul{padding-left:20px;margin-bottom:0}
.dashboard-details .block:last-child{margin-bottom:0}
@media(max-width:400px){.app-chrome h1{font-size:1.2rem}.app-chrome .status{font-size:.73rem}.dashboard-model .row-top{align-items:flex-start}.dashboard-model .value{font-size:.9rem}.mounting-card{padding:10px}}

</style>

<style id="remote-sync-style">
.remote-lock .wrap{display:none}
.remote-auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg,#f3f4f5);color:var(--ink,#18212e)}
.remote-auth[hidden]{display:none}
.remote-auth-card{width:min(100%,430px);background:var(--card,#fff);border:1px solid var(--line,#d9dde2);border-radius:16px;padding:22px;box-shadow:0 12px 38px rgba(0,0,0,.08)}
.remote-auth-card h1{margin:0 0 6px;font-size:1.45rem}
.remote-auth-card .sub{margin:0 0 18px}
.remote-auth-card .field{margin-bottom:12px}
.remote-auth-card .btn{width:100%}
.remote-auth-extra{margin-top:12px;padding-top:12px;border-top:1px solid var(--line,#d9dde2)}
.remote-auth-msg{font-size:.86rem;margin-top:10px;color:var(--soft,#65707d)}
.remote-auth-msg.error{color:var(--danger,#b42318);font-weight:650}
.remote-cloud-note{margin-top:12px;font-size:.8rem;color:var(--soft,#65707d);text-align:center}
</style>
</head>
<body class="remote-lock">
<div class="wrap">
  <div class="app-chrome">
  <header>
    <h1>Acompanhar Produção</h1>
    <div class="status"><span class="dot"></span><span id="header-status" role="status" aria-live="polite">Conectando à base online…</span></div>
  </header>

  <nav role="tablist" aria-label="Navegação principal">
    <button role="tab" aria-selected="true" data-tab="week">Início</button>
    <button role="tab" aria-selected="false" data-tab="stock">Estoque</button>
    <button role="tab" aria-selected="false" data-tab="expenses">Gastos</button>
    <button role="tab" aria-selected="false" data-tab="sales">Pedidos</button>
    <button role="tab" aria-selected="false" data-tab="entry">Lançar</button>
    <button role="tab" aria-selected="false" data-tab="history">Histórico</button>
    <button role="tab" aria-selected="false" data-tab="settings">Ajustes</button>
  </nav>
  </div>

  <main>
    <section id="tab-week"></section>
    <section id="tab-stock" hidden></section>
    <section id="tab-expenses" hidden></section>
    <section id="tab-sales" hidden></section>
    <section id="tab-entry" hidden></section>
    <section id="tab-history" hidden></section>
    <section id="tab-settings" hidden></section>
  </main>

  <div class="actions">
    <button class="btn" id="edit-goal" type="button">Editar meta</button>
    <button class="btn primary" id="share" type="button">Compartilhar resumo</button>
  </div>
  <footer id="app-footer">Base online Fiori Belle · sincronização automática · v2026.10.06-r7.3</footer>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="sheet" id="modal-sheet"></div>
</div>
<input id="backup-file" type="file" accept="application/json,.json" hidden>

<script src="inventory-guard.js"></script>
<script src="dashboard-view.js"></script>
<script>
"use strict";
const STORAGE_KEY="acompanhar_producao_v2";
const TZ="America/Sao_Paulo";
const COMPONENTS=[{id:"cabedal",name:"Cabedal"},{id:"palmilha",name:"Palmilhas"},{id:"solado",name:"Solado"}];
const DEFAULTS={
  version:4,
  settings:{
    pairsPerSheet:72,pairsPerKit:6,
    lineCosts:{},
    models:[
      {id:"m501",name:"501",active:true},{id:"m506",name:"506",active:true},
      {id:"m507",name:"507",active:true},{id:"m509",name:"509",active:true},
      {id:"m601",name:"601",active:true}
    ],
    mountings:[
      {id:"bruno_barbara",name:"Bruno e Bárbara",rate:null,active:true},
      {id:"jeferson",name:"Jeferson",rate:null,active:true},
      {id:"legacy",name:"Não informado",rate:null,active:false}
    ],
    workDays:[1,2,3,4,5]
  },
  weeks:{},stockLedger:[],factoryExpenses:[],lastBackup:null,onboardingDone:false
};
let data=loadData();
let ui={tab:"week",viewWeek:null,editingEntry:null};
let toastTimer=null;

function clone(v){return JSON.parse(JSON.stringify(v))}
function loadData(){
  try{
    const raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    if(!raw||typeof raw!=="object")return clone(DEFAULTS);
    const merged={...clone(DEFAULTS),...raw,settings:{...clone(DEFAULTS.settings),...(raw.settings||{})},weeks:raw.weeks||{}};
    merged.settings.models=normalizeItems(merged.settings.models,DEFAULTS.settings.models);
    merged.settings.mountings=normalizeMountings(merged.settings.mountings,DEFAULTS.settings.mountings);
    merged.settings.lineCosts={...clone(DEFAULTS.settings.lineCosts),...(merged.settings.lineCosts||{})};
    merged.settings.workDays=Array.isArray(merged.settings.workDays)?merged.settings.workDays.filter(n=>Number.isInteger(n)&&n>=0&&n<=6):[1,2,3,4,5];
    if(!merged.settings.mountings.some(x=>x.id==="legacy"))merged.settings.mountings.push({id:"legacy",name:"Não informado",rate:null,active:false});
    const defaultMounting="legacy";
    for(const w of Object.values(merged.weeks))for(const e of w.entries||[]){
      if(!e.mountingId)e.mountingId=defaultMounting;
      if(!e.mountingName)e.mountingName=merged.settings.mountings.find(x=>x.id===e.mountingId)?.name||"Montagem";
      if((e.kind==="palmilha"||e.kind==="solado")&&!e.line)e.line=modelLine(e.modelId,e.modelName,merged.settings.models);
    }
    merged.version=4;
    return merged;
  }catch(_){return clone(DEFAULTS)}
}
function nullableNumber(value){
  if(value===null||value===undefined||value==="")return null;
  const n=Number(value);
  return Number.isFinite(n)?n:null;
}
function normalizeItems(items,fallback){
  if(!Array.isArray(items)||!items.length)return clone(fallback);
  return items.filter(x=>x&&x.id&&x.name).map(x=>({
    id:String(x.id),name:String(x.name),active:x.active!==false,
    ref:x.ref?String(x.ref).toUpperCase():"",line:x.line?String(x.line):"",
    cabedalCost:nullableNumber(x.cabedalCost),
    totalCost:nullableNumber(x.totalCost),
    usesPalmilha:x.usesPalmilha!==false
  }));
}
function normalizeMountings(items,fallback){
  if(!Array.isArray(items)||!items.length)return clone(fallback);
  return items.filter(x=>x&&x.id&&x.name).map(x=>({id:String(x.id),name:String(x.name),rate:Math.max(0,Number(x.rate)||0),active:x.active!==false}));
}
function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  document.getElementById("header-status").textContent="Salvo às "+new Intl.DateTimeFormat("pt-BR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"}).format(new Date());
}
function spDate(date=new Date()){
  const parts=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date);
  const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
function addDays(iso,amount){const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+amount);return d.toISOString().slice(0,10)}
function dayOfWeek(iso){return new Date(iso+"T12:00:00Z").getUTCDay()}
function weekKeyFor(iso){const dow=dayOfWeek(iso);return addDays(iso,-((dow+6)%7))}
function currentWeekKey(){return weekKeyFor(spDate())}
function weekEnd(key){return addDays(key,6)}
function fmtDate(iso,short=false){if(!iso)return"";return new Intl.DateTimeFormat("pt-BR",short?{day:"2-digit",month:"2-digit"}:{day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date(iso+"T12:00:00Z"))}
function weekLabel(key){return `${fmtDate(key,true)} a ${fmtDate(weekEnd(key),false)}`}
const fmt=n=>Number(n||0).toLocaleString("pt-BR",{maximumFractionDigits:1});
const money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const pct=n=>Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=prefix=>prefix+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const activeModels=()=>data.settings.models.filter(x=>x.active!==false);
const activeMountings=()=>data.settings.mountings.filter(x=>x.active!==false);
function modelsForWeek(key){
  const snapshot=data.weeks[key]?.modelSnapshot;
  return key===currentWeekKey()||!Array.isArray(snapshot)||!snapshot.length?activeModels():snapshot;
}
function mountingsForWeek(key){
  const w=data.weeks[key],snapshot=w?.mountingSnapshot;
  const ids=new Set((w?.entries||[]).map(e=>e.mountingId));
  if(key!==currentWeekKey()&&Array.isArray(snapshot)&&snapshot.length){
    const list=clone(snapshot),known=new Set(list.map(x=>x.id));
    for(const mt of data.settings.mountings)if(ids.has(mt.id)&&!known.has(mt.id))list.push(clone(mt));
    return list;
  }
  return data.settings.mountings.filter(x=>x.active!==false||ids.has(x.id));
}

function workdayStats(key,readOnly=false){
  const days=data.settings.workDays,today=spDate(),end=weekEnd(key);
  let elapsed=0,remaining=0,total=0;
  for(let i=0;i<7;i++){
    const d=addDays(key,i);if(!days.includes(dayOfWeek(d)))continue;total++;

  }

function weekSummary(key){
  const balanceDate=key===currentWeekKey()?spDate():weekEnd(key);
  const w=weekData(key),t=totalsFor(key),goal=Number(w.goal)||0,stock=inventoryUntil(balanceDate),stockByMounting=inventoryByMountingUntil(balanceDate);
  const componentTotals={
    cabedal:Object.values(stockByMounting).reduce((sum,mt)=>sum+Object.values(mt.models).reduce((a,m)=>a+Math.max(0,m.cabedal||0),0),0),
    palmilha:Object.values(stockByMounting).reduce((sum,mt)=>sum+Object.values(mt.lines).reduce((a,line)=>a+Math.max(0,line.palmilha||0),0),0),
    solado:Object.values(stockByMounting).reduce((sum,mt)=>sum+Object.values(mt.lines).reduce((a,line)=>a+Math.max(0,line.solado||0),0),0)
  };
  const gargalo=COMPONENTS.reduce((a,b)=>componentTotals[b.id]<componentTotals[a.id]?b:a,COMPONENTS[0]);
  const possible=Object.values(stockByMounting).reduce((total,mt)=>total+possibleForMounting(mt),0);
  const work=workdayStats(key,key<currentWeekKey());

function saveEntry(e){
  e.preventDefault();const date=document.getElementById("entry-date").value,raw=document.getElementById("entry-qty").value.trim();

  if(!color){showToast("Informe a cor para controlar o estoque.");return}

  const candidate={kind,mountingId,modelId,modelName,line,qty,date,color},missing=candidateStockProblems(ui.editingEntry?.id,candidate);

function deleteEntry(weekKey,id){

function saveLineCosts(){

function readModelForm(){

  if(!/^\d{3}R?$/.test(ref)){showToast("Use uma referência com 3 números, por exemplo 514.");return null}
  if(!name){showToast("Digite o nome do modelo.");return null}

  if(!Number.isFinite(cabedalCost)||cabedalCost<0){showToast("Informe o custo do cabedal.");return null}

function addItem(type){
  if(type==="models"){
    showModal('<h2 id="modal-title">Adicionar modelo</h2>'+modelFormHtml({usesPalmilha:true,line:"500"})+'<div class="button-row"><button class="btn" data-modal-close>Cancelar</button><button class="btn primary" id="confirm-add">Adicionar modelo</button></div>');
    document.getElementById("model-line").oninput=e=>{if(e.target.value==="300")document.getElementById("model-uses-insole").checked=false};
    document.getElementById("confirm-add").onclick=()=>{
      const values=readModelForm();if(!values)return;
      const duplicate=data.settings.models.find(x=>x.active!==false&&modelRefValue(x)===values.ref);
      if(duplicate){showToast("Essa referência já está cadastrada.");return}
      data.settings.models.push({id:uid("m"),...values,active:true});syncCurrentSnapshots();save();closeModal();render();showToast("Modelo e ficha de custo adicionados.");
    };
    return;
  }
  const label=type==="stages"?"etapa":"item";
  showModal('<h2 id="modal-title">Adicionar '+label+'</h2><div class="field"><label for="new-item">Nome</label><input id="new-item" autocomplete="off"></div><div class="button-row"><button class="btn" data-modal-close>Cancelar</button><button class="btn primary" id="confirm-add">Adicionar</button></div>');
  document.getElementById("confirm-add").onclick=()=>{const name=document.getElementById("new-item").value.trim();if(!name){showToast("Digite um nome.");return}data.settings[type].push({id:uid("i"),name,active:true});syncCurrentSnapshots();save();closeModal();render();showToast("Item adicionado.")};
}
function addMounting(){
  showModal(`<h2 id="modal-title">Adicionar montagem</h2><div class="field"><label for="new-mounting">Nome</label><input id="new-mounting" autocomplete="off" placeholder="Nome da equipe"></div><div class="field"><label for="new-rate">Valor por par</label><input id="new-rate" inputmode="decimal" placeholder="Ex.: 3,50"></div><div class="button-row"><button class="btn" data-modal-close>Cancelar</button><button class="btn primary" id="confirm-mounting">Adicionar</button></div>`);
  document.getElementById("confirm-mounting").onclick=()=>{const name=document.getElementById("new-mounting").value.trim(),rate=parseMoney(document.getElementById("new-rate").value);if(!name){showToast("Digite o nome da montagem.");return}if(!Number.isFinite(rate)||rate<0){showToast("Digite um valor válido por par.");return}data.settings.mountings.push({id:uid("mt"),name,rate:Math.round(rate*100)/100,active:true});syncCurrentSnapshots();save();closeModal();render();showToast("Montagem adicionada.")};
}
async function exportBackup(){
  try{
    let snapshot=clone(data),revision=null;
    if(window.fioriOnline?.onlineMode){
      if(window.fioriOnline.hasPending?.())throw new Error("Há alterações pendentes. Aguarde a confirmação online antes do backup.");
      const row=await window.fioriOnline.getConfirmedState();snapshot=clone(row.data);revision=Number(row.revision||0);
    }
    const exportedAt=new Date().toISOString();
    const payload={app:"acompanhar-producao",exportedAt,revision,data:snapshot};
    const raw=JSON.stringify(payload,null,2),digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(raw));
    payload.sha256=[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,"0")).join("");
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=`acompanhar-producao-backup-${exportedAt.replace(/[:.]/g,"-")}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
    showToast("Backup da base confirmada exportado.");
  }catch(e){showToast(String(e?.message||"Não foi possível exportar o backup."))}
}
function validBackup(obj){return obj&&obj.app==="acompanhar-producao"&&obj.data&&obj.data.settings&&Array.isArray(obj.data.settings.models)&&obj.data.weeks&&typeof obj.data.weeks==="object"}
async function importBackup(file){
  if(window.fioriOnline?.onlineMode){
    showModal(`<h2 id="modal-title">Restauração protegida</h2><p>Este app usa uma base online compartilhada. Importar um backup aqui poderia substituir dados de todos os aparelhos.</p><p>Use o procedimento administrativo de restauração em ambiente isolado.</p><button class="btn primary full" data-modal-close>Fechar</button>`);
    document.getElementById("backup-file").value="";return;
  }
  try{
    const parsed=JSON.parse(await file.text());if(!validBackup(parsed))throw new Error("Arquivo incompatível");
    confirmAction({title:"Substituir dados locais?",message:"Esta ação só é permitida fora do modo online.",confirmText:"Importar",danger:true,onConfirm:()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(parsed.data));data=loadData();ui={tab:"week",viewWeek:null,editingEntry:null};save();switchTab("week");showToast("Backup importado localmente.")}});
  }catch(e){showToast("Este arquivo não é um backup válido do app.")}finally{document.getElementById("backup-file").value=""}
}
function shareText(){
  const key=currentWeekKey(),s=weekSummary(key),mountings=mountingsForWeek(key);
  return[
    "ACOMPANHAR PRODUÇÃO",`Semana: ${weekLabel(key)}`,`Meta: ${s.goal?fmt(s.goal)+" pares":"não definida"}`,"",
    "COMPONENTES DISPONÍVEIS",...COMPONENTS.map(c=>`${c.name}: ${fmt(s.componentTotals[c.id]||0)} pares`),"",
    "POR MONTAGEM",...mountings.map(mt=>`${mt.name}: ${fmt(s.byMounting[mt.id]||0)} pares · ${money((s.byMounting[mt.id]||0)*(Number(mt.rate)||0))}`),"",
    `Pares prontos: ${fmt(s.done)}${s.goal?` · ${pct(s.rate)}`:""}`,`Pode produzir agora: ${fmt(s.possible)} pares`,`Gargalo: ${s.gargalo?.name||"—"}`,`Projeção: ${fmt(s.projection)} pares no ritmo atual`
  ].join("\n");
}
async function share(){
  const text=shareText();
  try{if(navigator.share)await navigator.share({title:"Acompanhar Produção",text});else window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank","noopener,noreferrer")}
  catch(e){if(e.name!=="AbortError"){try{await navigator.clipboard.writeText(text);showToast("Resumo copiado.")}catch(_){showToast("Não foi possível compartilhar.")}}}
}
function switchTab(tab){
  ui.tab=tab;document.querySelectorAll("nav [role=tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  ["week","entry","history","settings"].forEach(k=>document.getElementById("tab-"+k).hidden=k!==tab);
  document.querySelector(".actions").hidden=tab!=="week";render();
}
function render(){
  ensureWeek();
  if(ui.tab==="week")renderWeek();
  if(ui.tab==="entry")renderEntry();
  if(ui.tab==="history")renderHistory();
  if(ui.tab==="settings")renderSettings();
}
function makeIcon(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><rect width="180" height="180" rx="38" fill="#18212e"/><path d="M45 126V96h20v30H45zm35 0V69h20v57H80zm35 0V44h20v82h-20z" fill="#edf0f3"/><circle cx="135" cy="44" r="9" fill="#c98a00"/></svg>`;
  document.getElementById("app-icon").href="data:image/svg+xml,"+encodeURIComponent(svg);
  const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");canvas.width=canvas.height=180;
  ctx.fillStyle="#18212e";ctx.beginPath();ctx.roundRect(0,0,180,180,38);ctx.fill();ctx.fillStyle="#edf0f3";ctx.fillRect(45,96,20,30);ctx.fillRect(80,69,20,57);ctx.fillRect(115,44,20,82);ctx.fillStyle="#c98a00";ctx.beginPath();ctx.arc(135,44,9,0,Math.PI*2);ctx.fill();
  document.getElementById("apple-icon").href=canvas.toDataURL("image/png");
}
document.querySelectorAll("nav [role=tab]").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
document.getElementById("edit-goal").onclick=goalModal;
document.getElementById("share").onclick=share;
document.getElementById("backup-file").onchange=e=>{const f=e.target.files?.[0];if(f)importBackup(f)};
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal"||e.target.closest("[data-modal-close]"))closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("modal").hidden)closeModal()});
makeIcon();render();
if(!data.onboardingDone)setTimeout(onboarding,80);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

<!-- STOCK_PANEL_V1 -->
<script>
(function stockPanelBootstrap(catalog, catalogUpdatedAt){
  const STOCK_SECTORS=[
    {id:"cabedal",name:"Cabedal",costKey:"cabedal"},
    {id:"solado",name:"Solados",costKey:"solado"},
    {id:"palmilha",name:"Palmilhas",costKey:"palmilha"},
    {id:"produto_pronto",name:"Produto pronto",costKey:"total"}
  ];
  const CATALOG={};
  const catalogSheet=ref=>{const key=String(ref).toUpperCase();return data.settings.costCatalog?.[key]||null};
  const refs=()=>Object.values(data.settings.costCatalog||{}).sort((a,b)=>String(a.ref).localeCompare(String(b.ref),"pt-BR",{numeric:true}));
  const localModelRef=m=>String(m?.ref||String(m?.name||"").match(/\b\d{3}R?\b/i)?.[0]||"").toUpperCase();
  const localSheet=ref=>{
    const key=String(ref).toUpperCase();
    const m=data.settings.models.find(x=>localModelRef(x)===key);
    if(!m)return null;
    const catalog=catalogSheet(key)||{};
    const complete=m.cabedalCost!==null&&m.cabedalCost!==undefined&&m.cabedalCost!==""&&m.totalCost!==null&&m.totalCost!==undefined&&m.totalCost!==""&&Number.isFinite(Number(m.cabedalCost))&&Number.isFinite(Number(m.totalCost));
    return{
      ...catalog,
      ref:localModelRef(m),model:m.name,line:m.line||catalog.line||modelLine(m.id,m.name),
      cabedal:complete?Number(m.cabedalCost):(catalog.cabedal??null),
      solado:catalog.solado??null,palmilha:catalog.palmilha??null,
      total:complete?Number(m.totalCost):(catalog.total??null),
      complete:complete||catalog.complete===true,usesPalmilha:m.usesPalmilha!==false,
      alert:complete?"":(catalog.alert||"Ficha local com custos incompletos.")
    };
  };
  const sheetForRef=ref=>{const local=localSheet(ref);return local?.complete?local:(catalogSheet(ref)||local||null)};
  const allRefSheets=()=>{
    const map=new Map(refs().map(x=>[String(x.ref),x]));
    for(const m of data.settings.models){const s=localSheet(localModelRef(m));if(s?.ref)map.set(String(s.ref),s)}
    return [...map.values()].sort((a,b)=>String(a.ref).localeCompare(String(b.ref),"pt-BR",{numeric:true}));
  };
  if(!Array.isArray(data.stockLedger))data.stockLedger=[];
  // Read-only catalog timestamp; never overwrite the online revision during rendering.

  const stockFmt=n=>Number(n||0).toLocaleString("pt-BR",{maximumFractionDigits:2});
  const stockMoney=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const parseQty=v=>{
    const raw=String(v??"").trim().replace(/\s/g,"");
    if(!raw)return NaN;
    return Number(raw.includes(",")?raw.replace(/\./g,"").replace(",","."):raw);
  };
  const sectorById=id=>STOCK_SECTORS.find(s=>s.id===id);
  const normalizeColor=value=>String(value||"").trim()?FioriInventory.colorLabel(FioriInventory.colorKey(value)):"";
  const movementDelta=m=>(m.direction==="out"?-1:1)*(Number(m.qty)||0);
  const itemKey=(sector,ref,color)=>[sector,String(ref),normalizeColor(color).toLocaleLowerCase("pt-BR")].join("|");
  const linePoolRef=line=>`@line:${String(line||"Outros")}`;
  const displayRef=ref=>String(ref||"").startsWith("@line:")?`Linha ${String(ref).slice(6)}`:String(ref||"")||"Sem referência";


  function balanceState(excludeId=null){
    const source=excludeId?{...data,stockLedger:(data.stockLedger||[]).filter(x=>x.id!==excludeId)}:data;
    const result=FioriInventory.ledger(source,{until:spDate()});
    return{rows:result.rows.filter(x=>x.scope==="global").map(x=>({sector:x.sector,ref:x.target,color:FioriInventory.colorLabel(x.color),qty:x.qty})),issues:result.issues.map(x=>x.message)};
  }
  function balances(excludeId=null){return balanceState(excludeId).rows}

  function lineStandardCost(line,key){
    const configured=data.settings.lineCosts?.[String(line)]?.[key];
    if(configured!==null&&configured!==undefined&&configured!==""&&Number.isFinite(Number(configured)))return Number(configured);
    return null;
  }
  function costInfo(sector,ref){
    if(String(ref).startsWith("@line:")){
      const line=String(ref).slice(6),key=sectorById(sector)?.costKey;
      if(sector!=="palmilha"&&sector!=="solado")return{ok:false,message:`${displayRef(ref)} sem referência para aplicar o custo.`};
      const value=lineStandardCost(line,key);
      if(Number.isFinite(value))return{ok:true,cost:value,sheet:{ref:displayRef(ref),model:`Componente compartilhado da Linha ${line}`}};
      return{ok:false,message:`Falta custo padrão de ${sectorById(sector)?.name.toLocaleLowerCase("pt-BR")||sector} para a Linha ${line}.`};
    }
    if(String(ref).startsWith("@"))return{ok:false,message:"Lançamento sem referência identificável. Informe a referência para valorizar este saldo."};
    const sheet=sheetForRef(String(ref));
    const sectorInfo=sectorById(sector);
    if(!sheet)return{ok:false,message:"Referência sem ficha de custo cadastrada."};
    if(sector==="palmilha"&&!sheet.usesPalmilha)return{ok:false,blocked:true,message:"Esta referência não usa palmilha."};
    if(sector==="produto_pronto"&&!sheet.complete){
      return{ok:false,message:sheet.alert||"Ficha com custos incompletos. O produto pronto não será valorizado até a ficha ser concluída."};
    }
    const value=sheet[sectorInfo.costKey];
    if(value===null||value===undefined||value===""||!Number.isFinite(Number(value))){
      return{ok:false,message:`Falta custo de ${sectorInfo.name.toLocaleLowerCase("pt-BR")} na ficha da Ref. ${sheet.ref}.`};
    }
    return{ok:true,cost:Number(value),sheet};
  }

  function quantityText(pairs){
    const kits=pairs/(Number(data.settings.pairsPerKit)||6);
    const sheets=pairs/(Number(data.settings.pairsPerSheet)||72);
    return `${stockFmt(pairs)} pares · ${stockFmt(kits)} kits · ${stockFmt(sheets)} fichas`;
  }

  function summary(){
    const state=balanceState(),positive=state.rows.filter(x=>x.qty>0.00001);
    const bySector={};
    let totalKnown=0,totalPending=0;
    for(const s of STOCK_SECTORS)bySector[s.id]={pairs:0,value:0,pendingPairs:0,items:[]};
    for(const row of positive){
      const box=bySector[row.sector]||(bySector[row.sector]={pairs:0,value:0,pendingPairs:0,items:[]});
      const ci=costInfo(row.sector,row.ref);
      const item={...row,costInfo:ci,value:ci.ok?row.qty*ci.cost:null};
      box.pairs+=row.qty;
      if(ci.ok){box.value+=item.value;totalKnown+=item.value}else{box.pendingPairs+=row.qty;totalPending+=row.qty}
      box.items.push(item);
    }
    return{bySector,totalKnown,totalPending,positive,issues:state.issues};
  }

  function renderStock(){
    const root=document.getElementById("tab-stock");
    if(!root)return;
    const s=summary();
    const hasAny=s.positive.length>0;
    const catalogDate=data.settings.costCatalogUpdatedAt||data.stockCatalogUpdatedAt||null;
    const updated=catalogDate?new Intl.DateTimeFormat("pt-BR",{dateStyle:"short",timeStyle:"short",timeZone:TZ}).format(new Date(catalogDate)):"catálogo online";
    const sectorCards=STOCK_SECTORS.map(sec=>{
      const box=s.bySector[sec.id];
      return `<div class="stock-sector-card">
        <div class="stock-sector-head"><strong>${esc(sec.name)}</strong><span>${stockFmt(box.pairs)} pares</span></div>
        <div class="stock-big">${stockMoney(box.value)}${box.pendingPairs?'<span class="stock-pending"> + pendente</span>':""}</div>
        <div class="stock-muted">${quantityText(box.pairs)}</div>
        ${box.pendingPairs?`<div class="stock-warning">⚠ ${stockFmt(box.pendingPairs)} pares sem custo calculável neste setor.</div>`:""}
      </div>`;
    }).join("");

    const details=STOCK_SECTORS.map(sec=>{
      const items=(s.bySector[sec.id].items||[]).sort((a,b)=>String(a.ref).localeCompare(String(b.ref),"pt-BR",{numeric:true})||a.color.localeCompare(b.color,"pt-BR"));
      return `<div class="block stock-detail"><h2>${esc(sec.name)}</h2><p class="sub">Detalhe por referência e cor.</p>
        ${items.length?items.map(item=>{
          const ci=item.costInfo;
          const sheet=sheetForRef(item.ref);
          return `<div class="row">
            <div class="row-top"><span class="name">${String(item.ref).startsWith("@")?esc(displayRef(item.ref)):`Ref. ${esc(item.ref)}`} · ${esc(item.color)}</span><span class="value">${stockFmt(item.qty)} pares</span></div>
            <div class="votes">${esc(sheet?.model||(String(item.ref).startsWith("@line:")?"Saldo legado por linha":"Modelo não informado"))} · ${quantityText(item.qty)}</div>
            ${ci.ok
              ?`<div class="calc">${stockFmt(item.qty)} pares × ${stockMoney(ci.cost)} = <strong>${stockMoney(item.value)}</strong></div>`
              :`<div class="stock-warning">⚠ ${esc(ci.message)}</div>`}
          </div>`;
        }).join(""):'<div class="empty">Nenhum saldo neste setor.</div>'}
      </div>`;
    }).join("");

    const history=[...data.stockLedger].sort((a,b)=>String(b.createdAt||b.date).localeCompare(String(a.createdAt||a.date))).slice(0,30);
    root.innerHTML=`
      <div class="block stock-total">
        <div class="sub">Valor total parado na fábrica</div>
        <div class="stock-total-value">${stockMoney(s.totalKnown)}</div>
        <div class="stock-muted">Soma dos valores calculáveis dos 4 setores, pelos custos padrão vigentes. Não representa pagamentos históricos.</div>
        ${s.totalPending?`<div class="stock-warning">⚠ Existem ${stockFmt(s.totalPending)} pares com custo pendente. O total acima é parcial e não usa R$ 0 para completar a conta.</div>`:""}
        ${s.issues.length?`<div class="stock-warning">⚠ Divergência de baixa automática: ${esc(s.issues[0])}${s.issues.length>1?` · mais ${s.issues.length-1} ocorrência(s)`:""}</div>`:""}
      </div>

      <div class="notice"><strong>Sincronizado com Produção.</strong> Cabedal, palmilha e solado lançados para a montagem entram automaticamente no estoque. Ao lançar Produto pronto, os componentes são baixados e os pares passam para Produto pronto.</div>

      <div class="stock-grid">${sectorCards}</div>

      <form class="block" id="stock-form">
        <h2>Ajuste manual de estoque</h2>
        <p class="sub">Use somente para saldo inicial, correções ou saídas que não vêm da produção, como expedição de produto pronto. Não repita aqui cabedal, palmilha ou solado já lançados na aba Lançar.</p>
        <div class="form-grid">
          <div class="field"><label for="stock-date">Data</label><input id="stock-date" type="date" value="${spDate()}"></div>
          <div class="field"><label for="stock-direction">Movimento</label><select id="stock-direction"><option value="in">Entrada</option><option value="out">Saída</option></select></div>
        </div>
        <div class="form-grid">
          <div class="field"><label for="stock-sector">Setor</label><select id="stock-sector">${STOCK_SECTORS.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div>
          <div class="field"><label for="stock-ref" id="stock-ref-label">Referência</label><select id="stock-ref"></select></div>
        </div>
        <div class="field"><label for="stock-color">Cor</label><input id="stock-color" list="stock-colors" placeholder="Ex.: Preto" autocomplete="off"><datalist id="stock-colors"><option value="Sem cor discriminada"><option value="Preto"><option value="Caramelo"><option value="Ouro Light"><option value="Rose"><option value="Off White"></datalist></div>
        <div class="form-grid">
          <div class="field"><label for="stock-unit">Unidade</label><select id="stock-unit"><option value="pairs">Pares</option><option value="kits">Kits (${stockFmt(data.settings.pairsPerKit)} pares)</option><option value="sheets">Fichas (${stockFmt(data.settings.pairsPerSheet)} pares)</option></select></div>
          <div class="field"><label for="stock-qty">Quantidade</label><input id="stock-qty" inputmode="decimal" placeholder="0" autocomplete="off"></div>
        </div>
        <div class="field"><label for="stock-note">Observação opcional</label><input id="stock-note" placeholder="Ex.: saldo físico, recebimento, expedição"></div>
        <div id="stock-cost-hint" class="calc"></div>
        <button class="btn primary full" id="stock-save" type="submit">Salvar movimento</button>
      </form>

      ${!hasAny?`<div class="notice">Ainda não há saldo. Assim que você lançar componentes ou Produto pronto na aba <strong>Lançar</strong>, o estoque será alimentado automaticamente.</div>`:""}

      ${details}

      <div class="block"><h2>Ajustes manuais recentes</h2><p class="sub">Últimos 30 ajustes feitos diretamente no estoque. Os movimentos da produção entram automaticamente e não precisam ser repetidos aqui.</p>
        ${history.length?history.map(m=>`<div class="row"><div class="row-top"><div><span class="name">${m.direction==="out"?"Saída":"Entrada"} · ${esc(sectorById(m.sector)?.name||m.sector)}</span><div class="votes">${fmtDate(m.date)} · Ref. ${esc(m.ref)} · ${esc(normalizeColor(m.color)||"Sem cor")} · ${stockFmt(m.qty)} pares${m.note?` · ${esc(m.note)}`:""}</div></div><button class="icon-btn danger" type="button" data-stock-delete="${esc(m.id)}">Apagar</button></div></div>`).join(""):'<div class="empty">Nenhum movimento lançado.</div>'}
      </div>

      <div class="block"><h2>Custos das fichas</h2><p class="sub">Catálogo incorporado a partir da base “Referências e Custos” do Registro Operacional.</p>
        <div class="calc">Atualização do catálogo: ${esc(updated)}. O site usa custo de cabedal, solado, palmilha e custo total separadamente.</div>
      </div>`;

    const form=document.getElementById("stock-form");
    const sectorEl=document.getElementById("stock-sector");
    const refEl=document.getElementById("stock-ref");
    const refLabel=document.getElementById("stock-ref-label");
    const qtyEl=document.getElementById("stock-qty");
    const unitEl=document.getElementById("stock-unit");
    const hint=document.getElementById("stock-cost-hint");
    const saveBtn=document.getElementById("stock-save");

    function refreshStockTarget(selected){
      const shared=sectorEl.value==="palmilha"||sectorEl.value==="solado";
      refLabel.textContent=shared?"Linha":"Referência";
      refEl.innerHTML=shared
        ?availableLines().map(line=>`<option value="${linePoolRef(line)}">Linha ${esc(line)}</option>`).join("")
        :allRefSheets().map(x=>`<option value="${esc(x.ref)}">${esc(x.ref)} · ${esc(x.model||"")}</option>`).join("");
      if(selected&&[...refEl.options].some(o=>o.value===selected))refEl.value=selected;
    }
    function qtyPairs(){
      const q=parseQty(qtyEl.value);
      if(!Number.isFinite(q)||q<=0)return NaN;
      const factor=unitEl.value==="kits"?(Number(data.settings.pairsPerKit)||6):unitEl.value==="sheets"?(Number(data.settings.pairsPerSheet)||72):1;
      return q*factor;
    }
    function refreshHint(){
      const ci=costInfo(sectorEl.value,refEl.value);
      const pairs=qtyPairs();
      saveBtn.disabled=!!ci.blocked;
      if(!ci.ok){hint.innerHTML=`<span class="stock-warning-inline">⚠ ${esc(ci.message)}</span>`;return}
      if(Number.isFinite(pairs)&&Math.abs(pairs-Math.round(pairs))<.000001){
        hint.innerHTML=`Custo unitário: <strong>${stockMoney(ci.cost)}</strong> · ${stockFmt(pairs)} pares × ${stockMoney(ci.cost)} = <strong>${stockMoney(pairs*ci.cost)}</strong>`;
      }else{
        hint.innerHTML=`Custo unitário deste setor: <strong>${stockMoney(ci.cost)}</strong>`;
      }
    }
    sectorEl.onchange=()=>{refreshStockTarget();refreshHint()};
    refEl.onchange=refreshHint;
    qtyEl.oninput=refreshHint;
    unitEl.onchange=refreshHint;
    refreshStockTarget();
    refreshHint();

    form.onsubmit=e=>{
      e.preventDefault();
      const date=document.getElementById("stock-date").value;
      const direction=document.getElementById("stock-direction").value;
      const sector=sectorEl.value;
      const ref=refEl.value;
      const color=normalizeColor(document.getElementById("stock-color").value);
      const note=document.getElementById("stock-note").value.trim();
      const pairs=qtyPairs();
      const ci=costInfo(sector,ref);
      if(!date){showToast("Escolha a data.");return}
      if(!color){showToast("Informe a cor.");return}
      if(!Number.isFinite(pairs)||pairs<=0||Math.abs(pairs-Math.round(pairs))>.000001){showToast("A quantidade precisa resultar em um número inteiro de pares.");return}
      if(ci.blocked){showToast(ci.message);return}
      const qty=Math.round(pairs);
      if(direction==="out"){
        const current=balances().find(x=>itemKey(x.sector,x.ref,x.color)===itemKey(sector,ref,color))?.qty||0;
        if(qty>current){showToast(`Saldo insuficiente: há ${stockFmt(current)} pares neste item.`);return}
      }
      const movement={id:uid("stk"),date,direction,sector,ref,color,qty,note,createdAt:new Date().toISOString()};
      const problems=FioriInventory.validate({...data,stockLedger:[...(data.stockLedger||[]),movement]});
      if(problems.length){showToast(problems[0].message);return}
      data.stockLedger.push(movement);
      save();renderStock();showToast("Movimento registrado. Aguardando confirmação online.");
    };

    document.querySelectorAll("[data-stock-delete]").forEach(btn=>btn.onclick=()=>{
      const id=btn.dataset.stockDelete;
      const movement=data.stockLedger.find(x=>x.id===id);
      if(!movement)return;
      const problems=FioriInventory.validate({...data,stockLedger:data.stockLedger.filter(x=>x.id!==id)});
      if(problems.length){showToast("Não é possível apagar. "+problems[0].message);return}
      confirmAction({title:"Apagar movimento?",message:`${movement.direction==="out"?"Saída":"Entrada"} de ${stockFmt(movement.qty)} pares da Ref. ${movement.ref} · ${movement.color}.`,confirmText:"Apagar",danger:true,onConfirm:()=>{
        data.stockLedger=data.stockLedger.filter(x=>x.id!==id);save();renderStock();showToast("Movimento apagado.");
      }});
    });
  }

  const oldRender=render;
  render=function(){
    if(ui.tab==="stock"){ensureWeek();renderStock();return}
    oldRender();
  };

  switchTab=function(tab){
    ui.tab=tab;
    document.querySelectorAll("nav [role=tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
    ["week","stock","entry","history","settings"].forEach(k=>{
      const el=document.getElementById("tab-"+k);
      if(el)el.hidden=k!==tab;
    });
    document.querySelector(".actions").hidden=tab!=="week";
    render();
  };
})([],"1970-01-01T00:00:00.000Z");
</script>
<!-- FACTORY_EXPENSES_V1 -->
<script>
(function factoryExpensesBootstrap(){
  if(!Array.isArray(data.factoryExpenses))data.factoryExpenses=[];
  if(!data.financeControl||typeof data.financeControl!=="object")data.financeControl={version:1,advances:[],settlements:[],createdAt:new Date().toISOString()};
  if(!Array.isArray(data.financeControl.advances))data.financeControl.advances=[];
  if(!Array.isArray(data.financeControl.settlements))data.financeControl.settlements=[];
  const EXPENSE_CATEGORIES=["Matéria-prima","Mão de obra","Combustível","Energia/água","Frete","Manutenção","Impostos","Aluguel","Pró-labore/Retirada","Outros"];
  const PAYMENT_METHODS=["Pix","Boleto","Cartão","Dinheiro","Transferência","Débito automático","Outro"];
  const expenseMoney=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const expenseNumber=v=>{
    const raw=String(v??"").trim().replace(/\s/g,"");
    if(!raw)return NaN;
    return Number(raw.includes(",")?raw.replace(/\./g,"").replace(",","."):raw);
  };
  const monthKey=date=>String(date||"").slice(0,7);
  const currentMonth=()=>spDate().slice(0,7);
  const monthLabel=m=>{
    const [y,mo]=m.split("-").map(Number);
    return new Intl.DateTimeFormat("pt-BR",{month:"long",year:"numeric",timeZone:TZ}).format(new Date(Date.UTC(y,mo-1,2)));
  };
  let expenseMonth=currentMonth();
  let editingExpenseId=null;

  function expensesForMonth(month){
    return data.factoryExpenses.filter(x=>monthKey(x.date)===month).sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
  }
  function expenseSummary(month){
    const rows=expensesForMonth(month);
    const expenseRows=rows.filter(x=>x.category!=="Pró-labore/Retirada");
    const withdrawalRows=rows.filter(x=>x.category==="Pró-labore/Retirada");
    const total=expenseRows.reduce((s,x)=>s+Number(x.amount||0),0);
    const paid=expenseRows.filter(x=>x.status==="paid").reduce((s,x)=>s+Number(x.amount||0),0);
    const pending=total-paid;
    const withdrawals=withdrawalRows.reduce((s,x)=>s+Number(x.amount||0),0);
    const byCategory={};
    for(const x of expenseRows)byCategory[x.category]=(byCategory[x.category]||0)+Number(x.amount||0);
    return{rows,expenseRows,withdrawalRows,total,paid,pending,withdrawals,byCategory};
  }
  const toCents=n=>Math.round(Number(n||0)*100);
  const fromCents=n=>Number(n||0)/100;
  const advanceExpense=a=>data.factoryExpenses.find(x=>x.id===a.expenseId);
  const settlementDiscountFor=(advanceId,excludeSettlementId=null)=>data.financeControl.settlements.filter(x=>x.id!==excludeSettlementId).reduce((sum,x)=>sum+(x.allocations||[]).filter(a=>a.advanceId===advanceId).reduce((n,a)=>n+Number(a.amountCents||0),0),0);
  const advanceBalanceCents=a=>Math.max(0,toCents(advanceExpense(a)?.amount)-settlementDiscountFor(a.id));
  const openAdvances=mountingId=>data.financeControl.advances.map(a=>({...a,expense:advanceExpense(a),balanceCents:advanceBalanceCents(a)})).filter(a=>a.mountingId===mountingId&&a.expense&&a.balanceCents>0);
  const linkedExpenseIds=()=>new Set([
    ...data.financeControl.advances.map(a=>a.expenseId),
    ...data.financeControl.settlements.map(x=>x.netExpenseId).filter(Boolean)
  ]);
  function settlementRows(){
    return [...data.financeControl.settlements].sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.createdAt).localeCompare(String(a.createdAt)));
  }
  function financePanel(){
    const advances=data.financeControl.advances.map(a=>({...a,expense:advanceExpense(a),balanceCents:advanceBalanceCents(a)})).filter(a=>a.expense);
    const open=advances.filter(a=>a.balanceCents>0);
    const openTotal=open.reduce((n,a)=>n+a.balanceCents,0);
    const mountings=data.settings.mountings.filter(x=>x.active!==false);
    const settlements=settlementRows();
    return `<div class="block">
      <h2>Adiantamentos e acertos</h2><p class="sub">O adiantamento já pago é descontado do acerto. O sistema registra como novo gasto somente o valor líquido pago no acerto.</p>
      <div class="summary-grid"><div class="summary-stat"><strong>${expenseMoney(fromCents(openTotal))}</strong><span>adiantamentos em aberto</span></div><div class="summary-stat"><strong>${settlements.length}</strong><span>acertos registrados</span></div></div>
      ${open.length?open.map(a=>`<div class="row"><div class="row-top"><span class="name">${esc(data.settings.mountings.find(m=>m.id===a.mountingId)?.name||a.mountingId)}</span><span class="value">${expenseMoney(fromCents(a.balanceCents))}</span></div><div class="votes">Pago em ${fmtDate(a.expense.date)} · previsto para ${a.dueDate?fmtDate(a.dueDate):"sem data"} · ${esc(a.expense.description)}</div></div>`).join(""):'<div class="empty">Nenhum adiantamento em aberto.</div>'}
      <form id="settlement-form" style="margin-top:12px">
        <div class="form-grid"><div class="field"><label for="settlement-date">Data do acerto</label><input id="settlement-date" type="date" value="${spDate()}"></div>
        <div class="field"><label for="settlement-mounting">Montagem</label><select id="settlement-mounting"><option value="">Selecione</option>${mountings.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("")}</select></div></div>
        <div class="field"><label for="settlement-gross">Valor bruto devido</label><input id="settlement-gross" inputmode="decimal" placeholder="0,00"></div>
        <div class="calc" id="settlement-preview">Selecione a montagem e informe o bruto. Os adiantamentos em aberto serão descontados até o limite do valor devido.</div>
        <div class="field"><label for="settlement-method">Forma do pagamento líquido</label><select id="settlement-method">${PAYMENT_METHODS.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div>
        <div class="field"><label for="settlement-note">Observação</label><input id="settlement-note" placeholder="Opcional"></div>
        <button class="btn primary full" type="submit">Registrar acerto</button>
      </form>
      ${settlements.length?`<div style="margin-top:14px"><strong>Histórico de acertos</strong>${settlements.map(x=>{const discounted=(x.allocations||[]).reduce((n,a)=>n+Number(a.amountCents||0),0),net=Number(x.grossCents||0)-discounted;return `<div class="row"><div class="row-top"><span class="name">${esc(data.settings.mountings.find(m=>m.id===x.mountingId)?.name||x.mountingId)} · ${fmtDate(x.date)}</span><span class="value">${expenseMoney(fromCents(x.grossCents))} bruto</span></div><div class="votes">Adiantamentos ${expenseMoney(fromCents(discounted))} · pago no acerto ${expenseMoney(fromCents(net))}</div></div>`}).join("")}</div>`:""}
    </div>`;
  }
  function expenseFormValues(item={}){
    return {date:item.date||spDate(),category:item.category||"Matéria-prima",description:item.description||"",supplier:item.supplier||"",amount:item.amount??"",method:item.method||"Pix",status:item.status||"paid",note:item.note||""};
  }

  function renderExpenses(){
    const root=document.getElementById("tab-expenses");if(!root)return;
    if(!Array.isArray(data.factoryExpenses))data.factoryExpenses=[];
    const s=expenseSummary(expenseMonth),edit=editingExpenseId?data.factoryExpenses.find(x=>x.id===editingExpenseId):null,v=expenseFormValues(edit||{});
    const cats=Object.entries(s.byCategory).sort((a,b)=>b[1]-a[1]);
    root.innerHTML=`
      <div class="block">
        <div class="readonly"><div><h2>Gastos da fábrica</h2><p class="sub">Controle mensal de despesas operacionais.</p></div><div class="field" style="margin:0;min-width:150px"><label for="expense-month">Mês</label><input id="expense-month" type="month" value="${esc(expenseMonth)}"></div></div>
        <div class="summary-grid">
          <div class="summary-stat"><strong>${expenseMoney(s.total)}</strong><span>Total lançado</span></div>
          <div class="summary-stat"><strong>${expenseMoney(s.paid)}</strong><span>Pago</span></div>
          <div class="summary-stat"><strong>${expenseMoney(s.pending)}</strong><span>Pendente</span></div>
          <div class="summary-stat"><strong>${s.expenseRows.length}</strong><span>Gastos</span></div>
          <div class="summary-stat"><strong>${expenseMoney(s.withdrawals)}</strong><span>Retiradas · fora dos gastos</span></div>
        </div>
      </div>
      ${financePanel()}\n      <form class="block" id="expense-form">
        <h2>${edit?"Editar gasto":"Novo gasto"}</h2>
        <div class="form-grid">
          <div class="field"><label for="expense-date">Data</label><input id="expense-date" type="date" value="${esc(v.date)}"></div>
          <div class="field"><label for="expense-category">Categoria</label><select id="expense-category">${EXPENSE_CATEGORIES.map(x=>`<option ${x===v.category?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
        </div>
        <div class="field"><label for="expense-description">Descrição</label><input id="expense-description" value="${esc(v.description)}" placeholder="Ex.: compra de tiras Israel 06 mm"></div>
        <div class="form-grid">
          <div class="field"><label for="expense-supplier">Fornecedor / favorecido</label><input id="expense-supplier" value="${esc(v.supplier)}" placeholder="Ex.: RD Injetados"></div>
          <div class="field"><label for="expense-amount">Valor</label><input id="expense-amount" inputmode="decimal" value="${v.amount===""?"":Number(v.amount).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}" placeholder="0,00"></div>
        </div>
        <div class="form-grid">
          <div class="field"><label for="expense-method">Pagamento</label><select id="expense-method">${PAYMENT_METHODS.map(x=>`<option ${x===v.method?"selected":""}>${esc(x)}</option>`).join("")}</select></div>
          <div class="field"><label for="expense-status">Situação</label><select id="expense-status"><option value="paid" ${v.status==="paid"?"selected":""}>Pago</option><option value="pending" ${v.status==="pending"?"selected":""}>Pendente</option></select></div>
        </div>
        <div class="field"><label for="expense-note">Observação</label><input id="expense-note" value="${esc(v.note)}" placeholder="Opcional"></div>
        <div class="button-row">${edit?'<button class="btn" type="button" id="cancel-expense-edit">Cancelar</button>':""}<button class="btn primary" type="submit">${edit?"Salvar alteração":"Adicionar gasto"}</button></div>
      </form>
      <div class="block">
        <h2>Por categoria · ${esc(monthLabel(expenseMonth))}</h2>
        ${cats.length?cats.map(([cat,value])=>`<div class="row"><div class="row-top"><span class="name">${esc(cat)}</span><span class="value">${expenseMoney(value)}</span></div><div class="votes">${s.total?((value/s.total)*100).toLocaleString("pt-BR",{maximumFractionDigits:1}):0}% do mês</div></div>`).join(""):'<div class="empty">Nenhum gasto neste mês.</div>'}
      </div>
      <div class="block">
        <h2>Lançamentos</h2><p class="sub">${esc(monthLabel(expenseMonth))}</p>
        ${s.rows.length?s.rows.map(x=>`<div class="row"><div class="row-top"><div class="entry-main"><div class="entry-title">${esc(x.description)}</div><div class="entry-meta">${fmtDate(x.date)} · ${esc(x.category)}${x.category==="Pró-labore/Retirada"?" · fora dos gastos":""}${x.supplier?` · ${esc(x.supplier)}`:""} · ${esc(x.method||"")}</div><div class="entry-meta">${x.status==="paid"?"Pago":"Pendente"}${x.note?` · ${esc(x.note)}`:""}</div></div><div style="text-align:right"><div class="value">${expenseMoney(x.amount)}</div><div class="entry-actions" style="margin-top:5px"><button class="icon-btn" type="button" data-expense-edit="${esc(x.id)}">Editar</button><button class="icon-btn danger" type="button" data-expense-delete="${esc(x.id)}">Apagar</button></div></div></div></div>`).join(""):'<div class="empty">Nenhum lançamento.</div>'}
      </div>
      <div class="notice"><strong>Base online.</strong> Gastos e retiradas são sincronizados com os demais dados. Pró-labore/Retirada fica registrado, mas não entra no total de gastos.</div>`;

    document.getElementById("expense-month").onchange=e=>{expenseMonth=e.target.value||currentMonth();editingExpenseId=null;renderExpenses()};
    const settlementMounting=document.getElementById("settlement-mounting"),settlementGross=document.getElementById("settlement-gross"),settlementPreview=document.getElementById("settlement-preview");
    function settlementPlan(){
      const mountingId=settlementMounting.value,gross=expenseNumber(settlementGross.value),grossCents=Number.isFinite(gross)?toCents(gross):0;
      let remaining=grossCents;const allocations=[];
      for(const a of openAdvances(mountingId).sort((x,y)=>String(x.expense.date).localeCompare(String(y.expense.date)))){
        if(remaining<=0)break;const used=Math.min(remaining,a.balanceCents);if(used>0){allocations.push({advanceId:a.id,amountCents:used});remaining-=used}
      }
      return{mountingId,grossCents,allocations,discountedCents:allocations.reduce((n,a)=>n+a.amountCents,0),netCents:Math.max(0,remaining)};
    }
    function updateSettlementPreview(){
      const p=settlementPlan();
      if(!p.mountingId||p.grossCents<=0){settlementPreview.textContent="Selecione a montagem e informe o bruto. Os adiantamentos em aberto serão descontados até o limite do valor devido.";return}
      settlementPreview.innerHTML=`Bruto <strong>${expenseMoney(fromCents(p.grossCents))}</strong> − adiantamentos <strong>${expenseMoney(fromCents(p.discountedCents))}</strong> = pagar agora <strong>${expenseMoney(fromCents(p.netCents))}</strong>`;
    }
    settlementMounting.onchange=updateSettlementPreview;settlementGross.oninput=updateSettlementPreview;
    document.getElementById("settlement-form").onsubmit=e=>{
      e.preventDefault();const p=settlementPlan(),date=document.getElementById("settlement-date").value,method=document.getElementById("settlement-method").value,note=document.getElementById("settlement-note").value.trim();
      if(!date||!p.mountingId){showToast("Informe a data e a montagem.");return}
      if(p.grossCents<=0){showToast("Informe um valor bruto válido.");return}
      if(!p.allocations.length){showToast("Esta montagem não tem adiantamento em aberto. Lance o pagamento normalmente.");return}
      const mt=data.settings.mountings.find(m=>m.id===p.mountingId),settlementId=uid("acerto"),now=new Date().toISOString();
      let netExpenseId=null;
      if(p.netCents>0){
        netExpenseId=uid("gasto");
        data.factoryExpenses.push({id:netExpenseId,date,category:"Mão de obra",description:`Pagamento líquido do acerto · ${mt?.name||p.mountingId}`,supplier:mt?.name||"",amount:fromCents(p.netCents),method,status:"paid",note:`Acerto bruto ${expenseMoney(fromCents(p.grossCents))}; adiantamentos descontados ${expenseMoney(fromCents(p.discountedCents))}.${note?" "+note:""}`,createdAt:now,updatedAt:now});
      }
      data.financeControl.settlements.push({id:settlementId,date,mountingId:p.mountingId,grossCents:p.grossCents,allocations:p.allocations,netExpenseId,note,createdAt:now});
      save();expenseMonth=monthKey(date);renderExpenses();showToast("Acerto registrado. Aguardando confirmação online.");
    };
    document.getElementById("expense-form").onsubmit=e=>{
      e.preventDefault();
      const date=document.getElementById("expense-date").value;
      const category=document.getElementById("expense-category").value;
      const description=document.getElementById("expense-description").value.trim();
      const supplier=document.getElementById("expense-supplier").value.trim();
      const amount=expenseNumber(document.getElementById("expense-amount").value);
      const method=document.getElementById("expense-method").value;
      const status=document.getElementById("expense-status").value;
      const note=document.getElementById("expense-note").value.trim();
      if(!date){showToast("Escolha a data.");return}
      if(!description){showToast("Digite a descrição do gasto.");return}
      if(!Number.isFinite(amount)||amount<=0){showToast("Digite um valor válido.");return}
      const payload={date,category,description,supplier,amount:Math.round(amount*100)/100,method,status,note,updatedAt:new Date().toISOString()};
      if(editingExpenseId){
        const item=data.factoryExpenses.find(x=>x.id===editingExpenseId);if(item)Object.assign(item,payload);
        editingExpenseId=null;showToast("Alteração registrada. Aguardando confirmação online.");
      }else{
        data.factoryExpenses.push({id:uid("gasto"),...payload,createdAt:new Date().toISOString()});showToast("Gasto registrado. Aguardando confirmação online.");
      }
      expenseMonth=monthKey(date);save();renderExpenses();
    };
    document.getElementById("cancel-expense-edit")?.addEventListener("click",()=>{editingExpenseId=null;renderExpenses()});
    document.querySelectorAll("[data-expense-edit]").forEach(b=>b.onclick=()=>{if(linkedExpenseIds().has(b.dataset.expenseEdit)){showToast("Este lançamento está vinculado a um adiantamento/acerto e está protegido.");return}editingExpenseId=b.dataset.expenseEdit;const x=data.factoryExpenses.find(y=>y.id===editingExpenseId);if(x)expenseMonth=monthKey(x.date);renderExpenses();window.scrollTo({top:0,behavior:"smooth"})});
    document.querySelectorAll("[data-expense-delete]").forEach(b=>b.onclick=()=>{
      const item=data.factoryExpenses.find(x=>x.id===b.dataset.expenseDelete);if(!item)return;if(linkedExpenseIds().has(item.id)){showToast("Este lançamento está vinculado a um adiantamento/acerto e não pode ser apagado.");return}
      confirmAction({title:"Apagar gasto?",message:`${item.description} · ${expenseMoney(item.amount)}`,confirmText:"Apagar",danger:true,onConfirm:()=>{data.factoryExpenses=data.factoryExpenses.filter(x=>x.id!==item.id);save();renderExpenses();showToast("Gasto apagado.")}});
    });
  }

  const previousRender=render;
  render=function(){if(ui.tab==="expenses"){ensureWeek();renderExpenses();return}previousRender()};
  switchTab=function(tab){
    ui.tab=tab;
    document.querySelectorAll("nav [role=tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
    ["week","stock","expenses","sales","entry","history","settings"].forEach(k=>{const el=document.getElementById("tab-"+k);if(el)el.hidden=k!==tab});
    document.querySelector(".actions").hidden=tab!=="week";
    render();
  };
  document.querySelectorAll('nav [role=tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
})();
</script>


<!-- SALES_CONTROL_V1 -->
<script>
(function salesControlBootstrap(){
  if(!data.salesControl||typeof data.salesControl!=="object")data.salesControl={version:1,clients:[],orders:[],payments:[],createdAt:new Date().toISOString()};
  for(const k of ["clients","orders","payments"])if(!Array.isArray(data.salesControl[k]))data.salesControl[k]=[];
  const moneyCents=c=>Number(c||0)/100;
  const millsMoney=m=>(Number(m||0)/1000).toLocaleString("pt-BR",{style:"currency",currency:"BRL",minimumFractionDigits:2,maximumFractionDigits:3});
  const salesMoney=c=>moneyCents(c).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const parseSalesMoney=v=>{const raw=String(v??"").trim().replace(/\s/g,"");if(!raw)return NaN;const n=Number(raw.includes(",")?raw.replace(/\./g,"").replace(",","."):raw);return Number.isFinite(n)?Math.round(n*100):NaN};
  const clientById=id=>data.salesControl.clients.find(x=>x.id===id);
  const orderPaidCents=id=>data.salesControl.payments.reduce((n,p)=>n+(p.allocations||[]).filter(a=>a.orderId===id).reduce((s,a)=>s+Number(a.amountCents||0),0),0);
  const orderBalanceCents=o=>Math.max(0,Number(o.totalCents||0)-orderPaidCents(o.id));
  const clientBalanceCents=id=>data.salesControl.orders.filter(o=>o.clientId===id&&o.deliveryStatus!=="cancelled").reduce((n,o)=>n+orderBalanceCents(o),0);
  const paymentAllocatedCents=p=>(p.allocations||[]).reduce((n,a)=>n+Number(a.amountCents||0),0);
  const paymentCreditCents=p=>Math.max(0,Number(p.amountCents||0)-paymentAllocatedCents(p));
  const clientCreditCents=id=>data.salesControl.payments.filter(p=>p.clientId===id).reduce((n,p)=>n+paymentCreditCents(p),0);
  const orderStatus=o=>{const paid=orderPaidCents(o.id),total=Number(o.totalCents||0);return paid<=0?"Em aberto":paid>=total?"Pago":"Parcial"};
  const receiptText=o=>{
    const c=clientById(o.clientId),payments=data.salesControl.payments.filter(p=>(p.allocations||[]).some(a=>a.orderId===o.id)).sort((a,b)=>a.date.localeCompare(b.date));
    const lines=["JR Calçados",`Cliente: ${c?.name||"—"}`,`Pedido: ${fmtDate(o.date)}`,"",...o.items.map(i=>`${i.ref} · ${i.qty} pares × ${millsMoney(itemPriceMills(i))} = ${salesMoney(Math.round(i.qty*itemPriceMills(i)/10))}`),"",`Total do pedido: ${salesMoney(o.totalCents)}`];
    if(payments.length){lines.push("","Pagamentos:");for(const p of payments){const a=(p.allocations||[]).find(x=>x.orderId===o.id);lines.push(`${fmtDate(p.date)} · ${salesMoney(a.amountCents)}`)}}
    lines.push("",`Total pago: ${salesMoney(orderPaidCents(o.id))}`,`Saldo: ${salesMoney(orderBalanceCents(o))}`);
    return lines.join("\n");
  };
  function renderSales(){
    const root=document.getElementById("tab-sales");if(!root)return;
    const clients=[...data.salesControl.clients].sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
    const orders=[...data.salesControl.orders].sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.createdAt||"").localeCompare(String(a.createdAt||"")));

      <div class="block"><h2>Pedidos e recebimentos</h2><p class="sub">Valores recebidos são movimentos separados dos pedidos. Pagamentos são alocados aos pedidos mais antigos em aberto.</p>
        <div class="summary-grid"><div class="summary-stat"><strong>${salesMoney(receivable)}</strong><span>a receber</span></div><div class="summary-stat"><strong>${salesMoney(receivedMonth)}</strong><span>recebido no mês</span></div><div class="summary-stat"><strong>${openCount}</strong><span>pedidos em aberto</span></div><div class="summary-stat"><strong>${orders.length-openCount}</strong><span>demais pedidos</span></div></div>

      <form class="block" id="client-form"><h2>Novo cliente</h2><div class="form-grid"><div class="field"><label>Nome</label><input id="sales-client-name" placeholder="Ex.: Rifa"></div><div class="field"><label>Observação</label><input id="sales-client-note" placeholder="Opcional"></div></div><button class="btn primary" type="submit">Adicionar cliente</button></form>

        <div class="form-grid"><div class="field"><label>Valor recebido</label><input id="payment-amount" inputmode="decimal" placeholder="0,00"></div><div class="field"><label>Forma</label><select id="payment-method"><option>Pix</option><option>Dinheiro</option><option>Transferência</option><option>Outro</option></select></div></div>
        <div class="calc" id="payment-preview">O pagamento será aplicado primeiro ao pedido mais antigo em aberto. Se sobrar valor, ficará como crédito do cliente.</div><div class="field"><label>Observação</label><input id="payment-note" placeholder="Opcional"></div><button class="btn primary" type="submit">Registrar recebimento</button>

    document.getElementById("client-form").onsubmit=e=>{e.preventDefault();const name=document.getElementById("sales-client-name").value.trim(),note=document.getElementById("sales-client-note").value.trim();if(!name){showToast("Informe o nome do cliente.");return}if(data.salesControl.clients.some(c=>c.name.toLocaleLowerCase("pt-BR")===name.toLocaleLowerCase("pt-BR"))){showToast("Este cliente já está cadastrado.");return}data.salesControl.clients.push({id:uid("cli"),name,note,createdAt:new Date().toISOString()});save();renderSales();showToast("Cliente registrado. Aguardando confirmação online.")};
    document.getElementById("order-form").onsubmit=e=>{e.preventDefault();const clientId=document.getElementById("order-client").value,date=document.getElementById("order-date").value,deliveryStatus=document.getElementById("order-delivery").value,note=document.getElementById("order-note").value.trim(),raw=document.getElementById("order-items").value.trim();if(!clientId||!date||!raw){showToast("Informe cliente, data e itens.");return}const items=[];for(const line of raw.split(/\n+/)){const parts=line.split(";").map(x=>x.trim());if(parts.length<3){showToast("Use: referência ; pares ; preço por par.");return}const qty=Number(parts[1]),unitPriceMills=parseSalesPriceMills(parts[2]);if(!parts[0]||!Number.isSafeInteger(qty)||qty<=0||!Number.isFinite(unitPriceMills)||unitPriceMills<0){showToast("Há item inválido no pedido.");return}items.push({ref:parts[0].toUpperCase(),qty,unitPriceMills})}const totalMills=items.reduce((n,i)=>n+i.qty*i.unitPriceMills,0);if(totalMills%10!==0){showToast("O total do pedido não fecha em centavos. Confira quantidades e preços.");return}const totalCents=totalMills/10;data.salesControl.orders.push({id:uid("ped"),clientId,date,items,totalCents,deliveryStatus,note,createdAt:new Date().toISOString()});save();renderSales();showToast("Pedido registrado. Aguardando confirmação online.")};
    document.getElementById("payment-form").onsubmit=e=>{e.preventDefault();const clientId=document.getElementById("payment-client").value,date=document.getElementById("payment-date").value,amountCents=parseSalesMoney(document.getElementById("payment-amount").value),method=document.getElementById("payment-method").value,note=document.getElementById("payment-note").value.trim();if(!clientId||!date||!Number.isFinite(amountCents)||amountCents<=0){showToast("Informe cliente, data e valor recebido.");return}let remaining=amountCents;const allocations=[];const eligible=data.salesControl.orders.filter(o=>o.clientId===clientId&&o.deliveryStatus!=="cancelled"&&o.date<=date&&orderBalanceCents(o)>0).sort((a,b)=>a.date.localeCompare(b.date)||String(a.createdAt||"").localeCompare(String(b.createdAt||"")));for(const o of eligible){if(remaining<=0)break;const use=Math.min(remaining,orderBalanceCents(o));if(use>0){allocations.push({orderId:o.id,amountCents:use});remaining-=use}}data.salesControl.payments.push({id:uid("rec"),clientId,date,amountCents,method,note,allocations,createdAt:new Date().toISOString()});save();renderSales();showToast("Recebimento registrado. Aguardando confirmação online.")};
    document.querySelectorAll("[data-sales-receipt]").forEach(b=>b.onclick=async()=>{const o=data.salesControl.orders.find(x=>x.id===b.dataset.salesReceipt);if(!o)return;const txt=receiptText(o);try{if(navigator.share)await navigator.share({title:"Recibo JR Calçados",text:txt});else{await navigator.clipboard.writeText(txt);showToast("Recibo copiado.")}}catch(e){if(e.name!=="AbortError")showToast("Não foi possível compartilhar o recibo.")}});
  }
  const prevRenderSales=render;
  render=function(){if(ui.tab==="sales"){ensureWeek();renderSales();return}prevRenderSales()};
  const prevSwitchSales=switchTab;
  switchTab=function(tab){prevSwitchSales(tab);if(tab==="sales"){["week","stock","expenses","sales","entry","history","settings"].forEach(k=>{const el=document.getElementById("tab-"+k);if(el)el.hidden=k!==tab});renderSales()}};
  document.querySelectorAll('nav [role=tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
})();
</script>
